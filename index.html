<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- ВЕБ-ВЕРСИЯ: впишите адрес вашего сервера и уберите комментарий вокруг строки ниже -->
<!-- <meta name="pe-api" content="https://ВАШ-СЕРВЕР/api"> -->
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style><!-- Telegram Mini App: ready/expand when opened inside Telegram; harmless in a normal browser -->
<script async src="https://telegram.org/js/telegram-web-app.js" onload="try{var w=Telegram.WebApp;w.ready();w.expand();}catch(e){}"></script>
</head><body>
<title>Property English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a winding lesson path climbs the tower floor by floor (unit = floor); a side rail holds goal, streak and review; lessons open full-screen with a bottom check bar */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E4E9EE; --ink:#141B22; --muted:#5A6672; --line:#D3DAE0; --line-deep:#B9C3CC;
  --accent:#2847D0; --accent-deep:#1A2F94; --accent-soft:#DFE6FC; --on-accent:#FFFFFF;
  --tape:#F5B800; --tape-deep:#B98900; --tape-soft:#FBEBB5;
  --ok:#1F8A50; --ok-deep:#15663A; --ok-soft:#DAF1E3;
  --bad:#C42B1C; --bad-deep:#8E1D12; --bad-soft:#FBE1DD;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#18202A; --sunk:#121920; --ink:#E7ECF0; --muted:#9AA6B1; --line:#2A3540; --line-deep:#3A4753;
    --accent:#7F97FF; --accent-deep:#4A60C8; --accent-soft:#1F2B55; --on-accent:#0F1419;
    --tape:#F6C33B; --tape-deep:#A88216; --tape-soft:#4A3D12;
    --ok:#4FC98A; --ok-deep:#2C8A5A; --ok-soft:#133A29;
    --bad:#F27D70; --bad-deep:#A9463B; --bad-soft:#41201C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#18202A; --sunk:#121920; --ink:#E7ECF0; --muted:#9AA6B1; --line:#2A3540; --line-deep:#3A4753;
  --accent:#7F97FF; --accent-deep:#4A60C8; --accent-soft:#1F2B55; --on-accent:#0F1419;
  --tape:#F6C33B; --tape-deep:#A88216; --tape-soft:#4A3D12;
  --ok:#4FC98A; --ok-deep:#2C8A5A; --ok-soft:#133A29;
  --bad:#F27D70; --bad-deep:#A9463B; --bad-soft:#41201C; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.art{display:block;width:100%;height:auto;max-width:100%}
.hint{font-size:13px;color:var(--muted)}

/* 3D buttons */
.b3{border:0;border-radius:14px;padding:12px 22px;font-weight:700;font-size:14.5px;letter-spacing:.03em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-deep);transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.b3:active:not([disabled]){transform:translateY(4px);box-shadow:0 0 0 var(--accent-deep)}
.b3.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-deep);color:#fff}
.b3.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep);color:#fff}
.b3.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.b3[disabled]{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default}
.b3.wide{width:100%}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:left}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;border:0;background:none;padding:0;text-align:left}
.brand svg{width:38px;height:42px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:4px}
.nav button{border:2px solid transparent;background:transparent;padding:7px 12px;border-radius:12px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;color:var(--muted)}
.nav button[aria-current="page"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:14px;font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:flex;align-items:center;gap:5px}
.chip .ico{width:22px;height:22px}
.c-fire{color:#E8730C}.c-xp{color:var(--accent)}.c-key{color:var(--tape-deep)}

/* home */
main{padding-block:22px 64px}
.home{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:var(--f-display);font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
.card p{color:var(--muted);font-size:13.5px}
.goal{display:flex;gap:14px;align-items:center}
.ring{width:64px;height:64px;flex:none}
.ring .t{font-family:var(--f-mono);font-size:13px;font-weight:500;fill:var(--ink)}
.mini-ach{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.medal{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);border:2px solid var(--line)}
.medal.on{background:var(--tape-soft);color:var(--tape-deep);border-color:var(--tape)}
.medal .ico{width:22px;height:22px}
.wod{display:flex;gap:12px;align-items:center}
.wod .pic{width:64px;flex:none}
.wod b{font-size:16px}

.path{display:flex;flex-direction:column;gap:28px;min-width:0}
.unit{display:flex;flex-direction:column;scroll-margin-top:90px}
.ub{background:var(--u);color:#fff;border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 5px 0 var(--ud)}
.ub .ua{width:64px;flex:none;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.ub .ut{flex:1;min-width:0}
.ub .ue{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.ub h2{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.15}
.ub .en{font-size:13px;opacity:.9}
.ub .hb{border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:6px;align-items:center;white-space:nowrap}
.ub .hb:hover{background:rgba(255,255,255,.22)}
.handed{display:inline-block;margin-top:4px;font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;color:#141B22;background:repeating-linear-gradient(-45deg,#F5B800 0 9px,#FFD95A 9px 18px);border-radius:4px}
.nodes{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0 8px;--k:1}
.nw{display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateX(calc(var(--x) * var(--k) * 1px));position:relative}
.node{width:72px;height:66px;border-radius:50%;border:0;background:var(--u);color:#fff;box-shadow:0 7px 0 var(--ud);display:grid;place-items:center;transition:transform .06s,box-shadow .06s}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ud)}
.node .ico{width:30px;height:30px;stroke-width:2.4}
.node.fresh{background:var(--sunk);color:var(--muted);box-shadow:0 7px 0 var(--line-deep)}
.node.done{background:var(--tape);color:#141B22;box-shadow:0 7px 0 var(--tape-deep)}
.node.cp{width:84px;height:76px;border-radius:24px}
.node.cur{outline:5px solid color-mix(in srgb,var(--u) 35%,transparent);outline-offset:4px}
.stars{display:flex;gap:2px;min-height:14px}
.stars svg{width:14px;height:14px}
.start{position:absolute;bottom:calc(100% + 6px);background:var(--surface);color:var(--u);border:2px solid var(--line);font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.start::after{content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-5px) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.side-art{position:absolute;top:44px;width:128px;pointer-events:none}
.side-art.r{right:4%}.side-art.l{left:4%}

/* sheet / modal */
.veil{position:fixed;inset:0;z-index:40;background:rgba(10,14,20,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.veil{align-items:center}}
.sheet{background:var(--surface);border-radius:22px;padding:22px;width:100%;max-width:540px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:14px;border:2px solid var(--line)}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:21px}
.sheet h3{font-family:var(--f-display);font-size:15px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.sheet-top{display:flex;gap:14px;align-items:center}
.sheet-top .pic{width:72px;flex:none}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted);border:2px dashed var(--line);border-radius:12px;padding:10px 12px}
.wl{display:flex;flex-direction:column}
.wl div{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.wl b{font-weight:600}
.wl span{color:var(--muted)}
.gram{background:var(--sunk);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.gram ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.gram li{display:flex;gap:10px;align-items:flex-start}
.gram li span{display:block;color:var(--muted);font-size:13px}
.gram .tp{border-left:3px solid var(--tape);padding-left:10px}

/* speaker */
.say{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none;padding:0;color:var(--accent);box-shadow:0 2px 0 var(--line);vertical-align:middle}
.say .ico{width:17px;height:17px}
.nospeech .say,.nospeech .needs-speech{display:none!important}

/* lesson */
.lesson{min-height:100%;display:flex;flex-direction:column}
.ltop{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.ltop .wrap{display:flex;align-items:center;gap:14px;padding-block:14px;max-width:760px}
.x{border:0;background:none;padding:4px;color:var(--muted)}
.x .ico{width:26px;height:26px}
.pbar{flex:1;height:16px;background:var(--sunk);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.combo{font-family:var(--f-mono);font-size:13px;font-weight:500;color:#E8730C;display:flex;gap:4px;align-items:center;min-width:56px;justify-content:flex-end}
.lbody{flex:1;padding-block:10px 190px}
.lbody .wrap{max-width:760px;display:flex;flex-direction:column;gap:20px}
.kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:500}
.lh{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,3.2vw,26px);line-height:1.2}
.prompt{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,4.5vw,34px);letter-spacing:-.01em;line-height:1.15}
.ipa{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 var(--line);font-size:15.5px;font-weight:500}
.opt kbd{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:2px solid var(--line);border-radius:8px;width:26px;height:26px;display:grid;place-items:center;flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 0 var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}
.opt[disabled]{cursor:default}
.pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 4px 0 var(--line);font-weight:600}
.pick .art{max-width:150px}
.pick.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 0 var(--accent)}
.pick.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.pick.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}

.coach{display:flex;gap:12px;align-items:flex-end}
.coach .m{width:84px;flex:none}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px 16px;background:var(--surface);font-size:17px;font-weight:500;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}

.answer{min-height:112px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px 0;background-image:linear-gradient(transparent 52px,var(--line) 52px,var(--line) 54px,transparent 54px);background-size:100% 56px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 13px;font-size:16px;font-weight:500;box-shadow:0 3px 0 var(--line);line-height:1.25}
.tile.used{background:var(--sunk);color:transparent;box-shadow:none;border-color:var(--sunk);cursor:default}
.tile:active:not(.used){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-weight:500;box-shadow:0 4px 0 var(--line);min-height:52px}
.mt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 0 var(--accent)}
.mt.gone{opacity:.4;box-shadow:none;cursor:default;border-color:var(--ok);background:var(--ok-soft)}
.mt.err{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}

.typein{width:100%;min-height:110px;resize:vertical;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.typein:focus{border-color:var(--accent);outline:none}

.gapline{font-size:21px;font-weight:500;line-height:1.5}
.gapline .blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--ink);text-align:center;color:var(--accent)}
.chipopts{display:flex;flex-wrap:wrap;gap:10px}

.listen{display:flex;gap:14px;align-items:center}
.lbtn{width:96px;height:96px;border-radius:24px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 0 var(--accent-deep);display:grid;place-items:center}
.lbtn .ico{width:42px;height:42px}
.lbtn.slow{width:64px;height:64px;border-radius:18px;background:var(--surface);color:var(--accent);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.lbtn.slow .ico{width:26px;height:26px}

.newword{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center}
.newword .nwt{display:flex;flex-direction:column;gap:6px;min-width:0}
.newword .ru{font-size:19px;font-weight:600}
.newword .ex{color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.newbadge{align-self:flex-start;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#141B22;background:var(--tape);padding:2px 8px;border-radius:6px}
mark{background:var(--tape-soft);color:var(--ink);padding:0 2px;border-radius:3px}

.phone{border:2px solid var(--line);border-radius:22px;background:var(--sunk);overflow:hidden}
.ph-top{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--surface);border-bottom:2px solid var(--line)}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.ph-top b{display:block;font-size:14.5px}
.ph-top small{color:var(--muted);font-size:12px}
.ph-top .trb{margin-left:auto;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px;font-weight:700;font-size:12px}
.ph-top .trb[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.msgs{display:flex;flex-direction:column;gap:8px;padding:14px;max-height:340px;overflow-y:auto}
.msg{max-width:84%;padding:9px 13px;border-radius:16px;font-size:15px;display:flex;flex-direction:column;gap:2px}
.msg.in{align-self:flex-start;background:var(--surface);border-bottom-left-radius:4px}
.msg.out{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg small{font-size:12.5px;opacity:.75}
.msg .mrow{display:flex;gap:8px;align-items:flex-start}
.msg .say{width:26px;height:26px;border-radius:8px}
.msg .say .ico{width:13px;height:13px}
.typing{align-self:flex-end;font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.letter{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.letter .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:8px}
.ln{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;box-shadow:0 3px 0 var(--line);font-size:15px}
.ln.used{opacity:.3;box-shadow:none;cursor:default}
.letter .ln{border-style:dashed;box-shadow:none}
.pool{display:flex;flex-direction:column;gap:8px}

/* feedback bar */
.lfoot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.lfoot.okb{background:var(--ok-soft);border-top-color:transparent}
.lfoot.badb{background:var(--bad-soft);border-top-color:transparent}
.lfoot .wrap{max-width:760px;display:flex;gap:14px;align-items:center;justify-content:space-between;padding-block:16px;flex-wrap:wrap}
.fbm{display:flex;gap:12px;align-items:center;flex:1 1 300px;min-width:0}
.fbm .m{width:58px;flex:none}
.fbm h3{font-family:var(--f-display);font-weight:700;font-size:18px}
.okb h3{color:var(--ok)}.badb h3{color:var(--bad)}
.fbm p{font-size:14.5px}
.fbm p small{display:block;color:var(--muted);font-size:13px}
.lfoot .b3{min-width:160px}
.skip{border:0;background:none;color:var(--muted);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.05em}

/* done */
.done{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px}
.done .wrap{max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.done .m{width:150px}
.done h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,36px);color:var(--tape-deep)}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.st{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--surface)}
.st small{display:block;background:var(--c);color:#fff;font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px}
.st b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500;padding:10px 4px;font-variant-numeric:tabular-nums}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:46px;height:46px}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* dictionary & profile */
.pg{display:flex;flex-direction:column;gap:18px}
.pg h1{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.01em}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 12px;flex:1 1 240px;min-width:0}
.fchip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.dw{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center}
.dw .pic{width:52px}
.dw .ph{width:52px;height:52px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:18px}
.dw b{display:block;font-weight:600;line-height:1.25}
.dw span{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.dw .lrn{font-family:var(--f-mono);font-size:10.5px;color:var(--ok);text-transform:uppercase;letter-spacing:.06em}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sg{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center}
.sg .ico{width:28px;height:28px}
.sg b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.sg span{font-size:12.5px;color:var(--muted)}
.week{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:44px;background:var(--accent);border-radius:8px 8px 3px 3px;min-height:3px}
.week i.today{background:var(--tape)}
.week span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.week em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--ink)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ach{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.ach .medal{width:52px;flex:none}
.ach b{display:block}
.ach span{font-size:13px;color:var(--muted)}
.ach.off{opacity:.6}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 2px 0 var(--line)}

/* v3: levels, review, reading, flash, AI tutor, memory */
.lvlband{display:flex;flex-direction:column;gap:4px;padding:6px 4px 0;border-top:2px dashed var(--line-deep);margin-top:6px}
.lvlband .tag{font-size:12px;color:var(--ink);font-weight:500}
.lvlband p{color:var(--muted);font-size:13.5px}
.review-card{border-color:var(--accent);box-shadow:0 4px 0 var(--accent-soft)}
.rate{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.rate .b3{min-width:0;padding:10px 14px;font-size:13px}
.passage{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px 20px;font-size:17px;line-height:1.75;max-width:68ch}
.passage.small{font-size:14.5px;line-height:1.6;padding:12px 16px}
.passage summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.gl{border:0;background:none;padding:0 1px;font:inherit;color:var(--ink);text-decoration:underline;text-decoration-color:var(--tape);text-decoration-thickness:3px;text-underline-offset:4px;cursor:pointer}
.gl.on{background:var(--tape-soft);border-radius:4px}
.gls{display:inline-block;margin-left:6px;font-size:13px;font-family:var(--f-mono);color:var(--accent);background:var(--accent-soft);padding:0 6px;border-radius:6px;text-decoration:none;vertical-align:1px}
.flashcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:220px;justify-content:center}
.flashcard hr{width:60%;border:0;border-top:2px dashed var(--line)}
.flashcard .big.alt{color:var(--accent)}
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sc{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--line);align-items:start}
.sc:hover:not([disabled]){border-color:var(--u)}
.sc[disabled]{opacity:.55;cursor:default}
.sc b{display:block;font-size:15.5px;margin:2px 0 4px}
.sc span:not(.tag){display:block;font-size:13px;color:var(--muted);font-style:italic}
.aiwrap{max-width:760px;margin:0 auto}
.msgs.tall{max-height:min(56vh,520px);min-height:220px}
.typing.left{align-self:flex-start}
.wchips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;background:var(--surface);border-bottom:2px solid var(--line)}
.wchip{font-size:12px;font-family:var(--f-mono);border:1.5px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.wchip.on{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.fbx{align-self:flex-end;max-width:84%;font-size:13px;border-radius:12px;padding:7px 11px;display:flex;flex-direction:column;gap:3px}
.fbx.good{background:var(--ok-soft);color:var(--ink)}
.fbx.fix{background:var(--tape-soft);color:var(--ink)}
.fbx b{font-weight:600}
.errline{color:var(--bad);font-size:14px}
.hints{display:flex;flex-direction:column;gap:8px}
.hints .ln{display:flex;flex-direction:column;gap:2px}
.aibar{justify-content:flex-end}
.aibar>*{flex:0 0 auto}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:14px}
.cols ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.mem{display:flex;align-items:center;gap:3px;margin-top:4px}
.mem i{width:12px;height:5px;border-radius:2px;background:var(--sunk)}
.mem i.on{background:var(--ok)}
.mem em{font-style:normal;font-size:11px;color:var(--muted);margin-left:6px;font-family:var(--f-mono)}
.membar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.membar i{display:block;height:100%}
.memleg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.memleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.memleg b{color:var(--ink);font-variant-numeric:tabular-nums}
.method{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink);max-width:75ch}

/* speaking */
.sptop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.spcount{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:12.5px;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:99px}
.spcount .ico{width:15px;height:15px}
.spbubble{font-size:20px}
.shadow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 20px}
.shadow .big{flex:1 1 260px;font-size:clamp(20px,3.6vw,26px)}
.sphint{font-family:var(--f-mono);font-size:16px;color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 14px;letter-spacing:.02em}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0}
.micbtn{width:104px;height:104px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 7px 0 var(--accent-deep);display:grid;place-items:center;transition:transform .06s}
.micbtn .ico{width:44px;height:44px}
.micbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--accent-deep)}
.micbtn.on{background:var(--bad);box-shadow:0 7px 0 var(--bad-deep);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline:10px solid color-mix(in srgb,var(--bad) 25%,transparent)}}
.interim{font-size:18px;min-height:1.6em;text-align:center;color:var(--muted)}
.spmodes{align-self:flex-start;flex-wrap:wrap}
.spmodes button{display:inline-flex;gap:6px;align-items:center}
.spmodes .ico{width:16px;height:16px}
.spres{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.diff{font-size:21px;font-weight:500;line-height:1.5}
.wg{color:var(--ok)}
.wb{color:var(--bad);text-decoration:underline wavy;text-decoration-thickness:1.5px;text-underline-offset:4px}
.selfans{display:flex;gap:12px;align-items:center;background:var(--ok-soft);border-radius:16px;padding:14px 16px}
.selfans .big{flex:1;font-size:clamp(19px,3.4vw,24px)}
.assoc{display:flex;flex-direction:column;gap:3px;background:var(--tape-soft);border-radius:12px;padding:10px 12px;font-size:14.5px;text-align:left}
.assoc b{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tape-deep)}
.assoc .ph{font-style:italic;color:var(--muted)}
.assoc .link{display:inline-flex;gap:6px;align-items:center}
.assoc .ico{width:16px;height:16px}
.assoc-ph{width:150px;max-width:100%;aspect-ratio:1;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:64px}
.sphero{display:grid;grid-template-columns:120px minmax(0,1fr);gap:22px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px}
.sphero .m{width:120px}
.sphero-t{display:flex;flex-direction:column;gap:10px;min-width:0}
.sphero-t p{color:var(--muted);max-width:62ch}
@media (max-width:640px){ .sphero{grid-template-columns:minmax(0,1fr)} .sphero .m{width:84px} .micbtn{width:92px;height:92px} }

/* accounts */
.authwrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background-image:linear-gradient(rgba(40,71,208,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(40,71,208,.06) 1px,transparent 1px);background-size:22px 22px}
.authcard{width:100%;max-width:420px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 0 var(--line)}
.authhead{display:flex;gap:14px;align-items:center}
.authhead h1{font-family:var(--f-display);font-weight:800;font-size:22px}
.am{width:64px;flex:none}
.splash{display:flex;flex-direction:column;align-items:center;gap:10px}
.splash .am{width:96px}
.authseg{width:100%}
.authseg button{flex:1;padding:9px}
.authform{display:flex;flex-direction:column;gap:12px}
.authform label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.authform .search{flex:none;width:100%;font-size:16px;max-width:none}
.orline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.orline::before,.orline::after{content:"";flex:1;border-top:1px solid var(--line)}
.tgw{display:flex;justify-content:center;min-height:44px}
.okline{color:var(--ok);font-size:14px;font-weight:500}
.acct-top{display:flex;gap:12px;align-items:center}
.ava.big{width:52px;height:52px;font-size:22px;font-family:var(--f-display)}
.acct .row .search{max-width:none}
.acc-d summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px;padding:4px 0}
.acc-d .authform{padding-top:10px}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gl-head{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.gl-table{overflow-x:auto;background:var(--surface);border:2px solid var(--line);border-radius:18px}
.gl-table table{border-collapse:collapse;width:100%;font-size:14px}
.gl-table th{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:12px 14px;border-bottom:2px solid var(--line);white-space:nowrap}
.gl-table td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.gl-table tr:first-child td{border-top:0}

@media (max-width:960px){
  .home{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}

  .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

  .nav button span{display:none}
  .nodes{--k:.62}
  .side-art{width:84px;top:64px}
  .side-art.r{right:0}.side-art.l{left:0}
  .newword{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
  .newword .art{max-width:140px}
  .newword .ex,.newword .prompt{justify-content:center}
  .newword .newbadge{align-self:center}
  .rail{grid-template-columns:minmax(0,1fr)}
  .ub{flex-wrap:wrap}
  .ub .hb{width:100%;justify-content:center}
  .lfoot .b3{width:100%}
  .coach .m{width:64px}
  .rate{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .rate .b3{width:100%}
  .cols{grid-template-columns:minmax(0,1fr)}
  .aibar>*{flex:1 1 auto}
  .passage{font-size:16px;padding:14px}
}
@media (max-width:420px){ .chips{gap:10px} .brand small{display:none} .tiles3 .st b{font-size:18px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ---- v7: today dashboard, Oxford 5000, grammar ---- */
.chip.c-lvl{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-family:var(--f-display);font-size:12.5px;font-weight:700}
.oxl{display:inline-grid;place-items:center;min-width:34px;height:22px;padding:0 6px;border-radius:7px;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.04em;background:var(--sunk);color:var(--muted);flex:none}
.oxl.lv2{background:var(--accent-soft);color:var(--accent)}
.oxl.lv3{background:var(--tape-soft);color:var(--tape-deep)}

.lbar{position:relative;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;flex:1;min-width:60px}
.lbar i,.lbar b{position:absolute;inset:0 auto 0 0;border-radius:99px;display:block}
.lbar i{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.lbar b{background:var(--accent)}
.lbar.big{height:14px;flex:none}
.ltrack{display:flex;flex-direction:column;gap:6px;padding:6px 8px 0}
.lt-bar{position:relative;height:12px;border-radius:99px;background:var(--sunk)}
.lt-bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--ok));min-width:12px}
.lt-dot{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--surface);border:5px solid var(--tape);box-shadow:0 2px 0 var(--tape-deep)}
.lt-marks{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:700;font-size:13px;margin-inline:-8px}
.lrows{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:auto minmax(60px,1fr) auto;gap:10px;align-items:center}
.lnum{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.today{display:flex;flex-direction:column;gap:16px;min-width:0}
.hero{gap:14px;padding:20px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.02em}
.hero h1 small{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0;margin-left:6px}
.hero .m{width:74px;flex:none}
.plan{gap:14px;padding:20px}
.plan-h{display:flex;justify-content:space-between;align-items:center;gap:10px}

.steps li:last-child{padding-bottom:0}
.steps .sic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}

.steps li.fin .sic{background:var(--ok-soft);color:var(--ok)}
.steps b{display:block;font-weight:600;line-height:1.3}
.steps div span{display:block;font-size:13px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.steps .b3{padding:9px 14px;font-size:12.5px;white-space:nowrap}
.gapcard .gapnums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gapnums b{display:block;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.gapnums span{font-size:12.5px;color:var(--muted)}
.wod-card .ipa{display:block}
.pg-h{display:flex;gap:14px 24px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.pg-h>div:first-child{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:6px}
.pg-h .hint{max-width:62ch}
.acts{flex:0 1 auto;flex-wrap:wrap}
.acts .b3{padding:10px 14px;font-size:12.5px}
.lvgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.lvc{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.lvc.on{border-color:var(--accent);background:var(--accent-soft)}
.lvc>b{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.lvc>b small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.lvc>span:not(.oxl){font-size:12px;color:var(--muted)}
.lvc .lbar{flex:none;height:8px}
.oxlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.oxlist>.hint,.oxlist>.b3{grid-column:1/-1}
.ow{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.owm{display:flex;flex-direction:column;gap:1px;min-width:0}
.owm b{font-weight:600;font-size:16px;line-height:1.25}
.owm>span{font-size:13px;color:var(--muted);line-height:1.35}
.ost{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:10.5px!important;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.ost i{width:8px;height:8px;border-radius:50%;background:var(--line-deep);display:inline-block}
.ost i.s1{background:var(--tape)} .ost i.s2{background:var(--accent)} .ost i.s3{background:var(--ok)}
.ost em{font-style:normal;padding:1px 6px;border-radius:6px;background:var(--sunk)}
.ost em.act{background:var(--ok-soft);color:var(--ok-deep)}
.owb{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mini{border:2px solid var(--line);background:var(--surface);border-radius:9px;padding:3px 8px;font-size:12px;font-weight:600;display:inline-flex;align-items:center}
.mini .ico{width:14px;height:14px}
.oxcard,.tricard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.oxcard .big,.tricard .big{font-size:34px}
.oxcard .ru,.tricard .ru{font-size:19px;font-weight:600}
.oxcard .ex{color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.oxcard .ex small{display:block;font-size:13px}
.oxcard .assoc{align-self:stretch}
.oxcard .link{display:inline-flex;gap:6px;align-items:center}
.oxcard .link .ico{width:16px;height:16px}
.tricard{align-items:center;text-align:center;gap:12px;max-width:560px;width:100%;margin-inline:auto}
.tricard .row{width:100%}
.tricard h2{font-family:var(--f-display);font-size:21px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gcard{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.gcard b{font-weight:600;font-size:15.5px;line-height:1.3}
.gcard .en,.sheet .en{font-size:13px;color:var(--muted)}
.gcard .gst{margin-top:6px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;gap:5px;align-items:center}
.gcard .gst .ico{width:14px;height:14px}
.gcard.wip{border-color:var(--tape)} .gcard.wip .gst{color:var(--tape-deep)}
.gcard.fin{border-color:var(--ok)} .gcard.fin .gst{color:var(--ok)}
.gsum{font-size:16px;font-weight:500;max-width:65ch}
.scheme{display:flex;flex-wrap:wrap;gap:6px}
.slot{border:2px solid var(--accent);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;background:var(--accent-soft);min-width:0}
.slot small{font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.slot b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.slot:nth-child(even){border-color:var(--tape);background:var(--tape-soft)} .slot:nth-child(even) small{color:var(--tape-deep)}
.gh{font-family:var(--f-display);font-size:15px;font-weight:700}
.errs{display:flex;flex-direction:column;gap:8px}
.errs>div{border-left:3px solid var(--bad);padding-left:10px;display:flex;flex-direction:column;font-size:14.5px}
.errs s{color:var(--bad);text-decoration-thickness:1.5px}
.errs b{color:var(--ok-deep);font-weight:600}
.errs span{font-size:13px;color:var(--muted)}
.typein.short{min-height:58px}
.sheet.wide{max-width:720px}
.seg.wide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.wide button{display:flex;flex-direction:column;align-items:center;padding:10px 6px}
.seg.wide button b{font-family:var(--f-display);font-size:17px}
.seg.wide button small{font-size:11.5px;color:var(--muted)}
.seg.wide button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.upg{display:block;font-size:12.5px;border-top:1px dashed var(--line-deep);padding-top:3px;margin-top:2px}
.upg.act{color:var(--ok-deep);border-top:0;padding-top:0;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.oxadd{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.oxadd button{border:1.5px dashed var(--line-deep);background:transparent;border-radius:99px;padding:2px 9px;font-size:12px;color:var(--muted)}
.oxadd button i{font-style:normal;font-family:var(--f-mono);font-size:10px}
.oxadd button[disabled]{border-style:solid;color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
.setrow small.hint{font-size:12px}
@media (max-width:960px){ .lvgrid{grid-template-columns:repeat(6,minmax(0,1fr))} .rail .wod-card{display:flex} }
@media (max-width:640px){
  .hero h1{font-size:32px}
  .lrow{grid-template-columns:auto minmax(0,1fr)} .lnum{grid-column:1/-1}
  .steps li{grid-template-columns:36px minmax(0,1fr)} .steps .sic{width:36px;height:36px} .steps .b3{grid-column:1/-1;width:100%}
  .lvgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .oxlist{grid-template-columns:minmax(0,1fr)}
  .cols2{grid-template-columns:minmax(0,1fr)}
  .acts{width:100%} .acts .b3{flex:1 1 46%}
  .oxcard .big,.tricard .big{font-size:28px}
  .nav button{padding:7px 9px}
}
.lvc .oxl{align-self:flex-start}

/* ---- v8: C2 level, live English ---- */
.oxl.lv5{background:var(--ink);color:var(--surface)}
.lw{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.lwh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.lwh b{font-weight:700;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.lwh .oxl{margin-left:auto}
.lru{font-weight:600;font-size:15px}
.lmeta{display:flex;gap:6px;flex-wrap:wrap}
.tone{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tone.t1{background:var(--accent-soft);color:var(--accent)}
.tone.t2{background:var(--tape-soft);color:var(--tape-deep)}
.tone.t3{background:var(--bad-soft);color:var(--bad)}
.lm{font-size:14px;color:var(--muted);line-height:1.45;margin:0}
.lx{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4}
.lx i{font-style:italic;overflow-wrap:anywhere}
.lo{font-size:12px;color:var(--muted)}
.lw .mini{margin-top:2px}
.lnote{font-size:13.5px;color:var(--muted);max-width:75ch;margin:0}
.lquiz{display:flex;flex-direction:column;gap:12px}
.lquiz .big{font-size:30px}
.lqopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lqopts .opt{text-align:left}
@media (max-width:640px){ .lqopts{grid-template-columns:minmax(0,1fr)} .lquiz .big{font-size:24px} }

/* ---- v9: reading ---- */
.rtips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rtips div{display:flex;flex-direction:column;gap:2px;font-size:14px}
.rtips b{font-weight:600}
.rtips span{color:var(--muted);line-height:1.4}
.rd .pg-h>div:first-child{gap:8px}
.rd .pg-h .link{align-self:flex-start}
.rdcols{align-items:start}
.rdtext{display:flex;flex-direction:column;gap:14px}
.rdp{display:flex;gap:10px;align-items:flex-start}
.rdp p{margin:0;font-size:16.5px;line-height:1.65;max-width:68ch}
.rdside{display:flex;flex-direction:column;gap:12px;min-width:0}
.rdsent{font-style:italic;margin:0;line-height:1.5}
.rdbr{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rdbr li b{display:block;font-weight:600}
.rdbr li span{color:var(--muted)}
.rdgl{display:flex;flex-direction:column}
.rdgl>div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.rdgl>div:first-child{border-top:0}
.rdgl b{display:block;font-weight:600;font-size:14.5px}
.rdgl span{font-size:13px;color:var(--muted)}
.rdq{display:flex;flex-direction:column;gap:18px}
.rqi{display:flex;flex-direction:column;gap:8px}
.rqi>p{margin:0;font-weight:500}
.rwhy{margin:0;font-size:14px;padding:8px 12px;border-radius:10px}
.rwhy.ok{background:var(--ok-soft);color:var(--ok-deep)}
.rwhy.bad{background:var(--bad-soft);color:var(--bad)}
.rdres{border-top:2px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.rdres p{margin:0}
@media (max-width:900px){ .rdcols{grid-template-columns:minmax(0,1fr)} }

/* =========================================================
   v10 · premium skin. Concept: a quiet study desk — porcelain ground, ink-navy actions,
   a thin champagne-gold thread for progress. Soft elevation instead of cartoon outlines.
   ========================================================= */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#ECEEF3; --ink:#0F1A2E; --muted:#5E6779; --line:#E2E5EC; --line-deep:#CDD2DC;
  --accent:#15264A; --accent-deep:#0A162E; --accent-soft:#E8ECF5; --on-accent:#FFFFFF;
  --tape:#B8924A; --tape-deep:#8A6A2E; --tape-soft:#F4ECDC;
  --ok:#2E7D5B; --ok-deep:#1F5C42; --ok-soft:#E3F1EA;
  --bad:#B4412F; --bad-deep:#8A2F21; --bad-soft:#F8E6E2;
  --f-display:"Manrope","Golos Text",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(15,26,46,.05),0 8px 24px rgba(15,26,46,.06);
  --shadow-up:0 2px 4px rgba(15,26,46,.06),0 16px 40px rgba(15,26,46,.10);
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120; --surface:#131B2D; --sunk:#0F1626; --ink:#E9EDF5; --muted:#99A3B8; --line:#222C42; --line-deep:#2E3954;
    --accent:#D6B676; --accent-deep:#A98A4E; --accent-soft:#2A2618; --on-accent:#0B1120;
    --tape:#D6B676; --tape-deep:#C2A062; --tape-soft:#2A2618;
    --ok:#5CC596; --ok-deep:#3E9C72; --ok-soft:#12291F; --bad:#EE8A79; --bad-deep:#C46555; --bad-soft:#331A16;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-up:0 2px 4px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#131B2D; --sunk:#0F1626; --ink:#E9EDF5; --muted:#99A3B8; --line:#222C42; --line-deep:#2E3954;
  --accent:#D6B676; --accent-deep:#A98A4E; --accent-soft:#2A2618; --on-accent:#0B1120;
  --tape:#D6B676; --tape-deep:#C2A062; --tape-soft:#2A2618;
  --ok:#5CC596; --ok-deep:#3E9C72; --ok-soft:#12291F; --bad:#EE8A79; --bad-deep:#C46555; --bad-soft:#331A16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-up:0 2px 4px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.35); color-scheme:dark;
}
body{font-size:15.5px;letter-spacing:.005em}
h1,h2,h3,.lh,.big,.brand b{font-family:var(--f-display);letter-spacing:-.015em}

/* ---- calm components ---- */
.card,.gcard,.ow,.lw,.lvc,.oxcard,.tricard,.sheet,.libc,.tile{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r)}
.card h3{font-size:16px;font-weight:700}
.b3{text-transform:none;letter-spacing:0;font-size:15px;font-weight:600;border-radius:14px;padding:12px 20px;box-shadow:none;transition:background .15s,transform .1s}
.b3:active:not([disabled]){transform:scale(.98);box-shadow:none}
.b3:hover:not([disabled]){background:var(--accent-deep)}
.b3.ghost{border:1px solid var(--line-deep);box-shadow:none;background:var(--surface);color:var(--ink)}
.b3.ghost:hover:not([disabled]){background:var(--sunk)}
.b3.ok,.b3.bad{box-shadow:none}
.b3[disabled]{box-shadow:none}
.opt,.mt{border:1px solid var(--line-deep);box-shadow:none;border-radius:14px}
.opt:hover:not([disabled]),.mt:hover{border-color:var(--accent)}
.opt.sel,.mt.sel{box-shadow:0 0 0 1px var(--accent) inset}
.opt.right{box-shadow:0 0 0 1px var(--ok) inset}.opt.wrong{box-shadow:0 0 0 1px var(--bad) inset}
.opt kbd{border-width:1px}
.typein,.search{border:1px solid var(--line-deep);border-radius:14px}
.bubble{border:1px solid var(--line)}.bubble::before{border-width:1px}
.tag{font-family:var(--f-body);letter-spacing:.06em;font-weight:600}
.kicker{font-family:var(--f-body);color:var(--tape-deep);letter-spacing:.08em;font-weight:600}
.fchip{border-width:1px!important}
.pbar{height:8px}.pbar i{box-shadow:none;background:var(--tape)}
.lfoot{border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(15,26,46,.06)}
.lfoot.okb,.lfoot.badb{box-shadow:none}
.eyebrow{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tape-deep)}
.okline{color:var(--ok);font-weight:600}

/* ---- header: monogram + 4 sections ---- */
.hdr{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px)}
.mono{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.04em;flex:none}
.brand b{font-size:17px;font-weight:800}
.nav button{border:0;border-radius:12px;padding:8px 14px;font-size:14.5px}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:none}
.nav button[aria-current="page"] .ico{color:var(--tape-deep)}
.chip.c-lvl{border:1px solid var(--tape);background:var(--tape-soft);color:var(--tape-deep)}

/* ---- home ---- */
.hm{display:flex;flex-direction:column;gap:18px;padding-block:8px 32px;max-width:860px;margin-inline:auto}
.hm-hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow-up);padding:28px;display:flex;flex-direction:column;gap:22px}
.hm-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.hm-top h1{font-size:clamp(26px,4.4vw,36px);font-weight:800;line-height:1.1;margin-top:6px}
.hm-sub{color:var(--muted);font-size:15px;margin-top:8px}
.hm-ring{position:relative;width:72px;height:72px;flex:none}
.hm-ring svg{width:72px;height:72px}
.hm-ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.dpath{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.dpath li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;position:relative}
.dpath li+li{border-top:1px solid var(--line)}
.dpath .pn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:1px solid var(--line-deep);color:var(--muted);background:var(--surface)}
.dpath .pn .ico{width:16px;height:16px}
.dpath li.done .pn{background:var(--tape-soft);border-color:var(--tape);color:var(--tape-deep)}
.dpath li.now .pn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dpath b{display:block;font-weight:700;font-size:15.5px}
.dpath li.done b{color:var(--muted)}
.dpath li>div span{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.dpath em{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap}
.dpath li.now em{color:var(--tape-deep);font-weight:600}
.cta{width:100%;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);padding:16px 22px;font-family:var(--f-display);font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform .1s,background .15s}
.cta small{font-family:var(--f-body);font-weight:500;font-size:13px;opacity:.75}
.cta:hover{background:var(--accent-deep)}.cta:active{transform:scale(.99)}
.cta.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-deep);box-shadow:none;font-size:16px}
.hm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .wd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tile .wd b{font-family:var(--f-display);font-weight:800;font-size:22px;overflow-wrap:anywhere}
.tile .ru{font-weight:600;color:var(--ink);font-size:14.5px}
.tile .ex{color:var(--muted);font-size:13.5px;line-height:1.45;font-style:italic}
.tile .ex small{display:block;font-style:normal;margin-top:2px}
.tile .link{margin-top:auto;font-size:13.5px}
.lvl-row{display:flex;align-items:baseline;gap:10px}
.lvl-row b{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.lvl-row span{color:var(--muted);font-size:13.5px}
.lvl-bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.lvl-bar i{display:block;height:100%;background:var(--tape);border-radius:99px}

/* ---- library ---- */
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.libc{background:var(--surface);padding:18px;display:grid;grid-template-columns:44px minmax(0,1fr) 20px;gap:14px;align-items:center;text-align:left;transition:box-shadow .15s,transform .1s}
.libc:hover{box-shadow:var(--shadow-up)}
.libi{width:44px;height:44px;border-radius:14px;background:var(--tape-soft);color:var(--tape-deep);display:grid;place-items:center}
.libc b{display:block;font-family:var(--f-display);font-weight:800;font-size:17px}
.libm{display:block;font-size:13px;color:var(--tape-deep);font-weight:600;margin-top:2px}
.libd{display:block;font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.libgo{color:var(--muted)}

/* ---- grammar in one card ---- */
.geasy{background:var(--tape-soft);border:1px solid color-mix(in srgb,var(--tape) 45%,transparent);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.geasy .gf{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.35;color:var(--ink)}
.geasy .gw{color:var(--ink);font-size:15px}
.geasy .gx{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:12px;padding:10px 12px}
.geasy .gx b{display:block;font-weight:600}
.geasy .gx span{font-size:13.5px;color:var(--muted)}

.gmore summary::before{content:"+";display:inline-block;width:20px;color:var(--tape-deep);font-weight:800}
.gmore[open] summary::before{content:"–"}
.gmore[open]{padding-bottom:16px}

.done .row{flex-direction:column;align-items:stretch;gap:10px}

/* ---- lesson end: calm summary ---- */
.done .m{width:96px;opacity:.9}
.done h1{color:var(--ink);font-weight:800}
.st{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px}
.st small{background:transparent;color:var(--muted);letter-spacing:.08em;font-weight:600;padding:10px 4px 0}
.st b{font-family:var(--f-display);font-weight:800;font-size:22px;padding:2px 4px 12px}

  .nav button{flex-direction:column;gap:3px;font-size:11.5px;padding:6px 4px;border-radius:12px;justify-content:center}

 err:[["Yesterday bought the client a flat.","The client bought a flat yesterday.","Подлежащее обязательно и стоит перед глаголом."],["I like very much this project.","I like this project very much.","Глагол и дополнение не разрывают."],["He goes always to viewings.","He always goes to viewings.","Наречие частоты перед смысловым глаголом."]],
 q:[["b","The developer finished the building on time last year.","В прошлом году застройщик сдал дом вовремя."],
  ["b","We usually meet our clients at the office.","Мы обычно встречаемся с клиентами в офисе."],
  ["b","She has already sent the contract to the lawyer.","Она уже отправила договор юристу."],
  ["c","Which sentence is correct?",["I visited the site with the client on Friday.","I visited on Friday with the client the site.","On Friday visited I the site with the client."],"Что → как/с кем → когда."],
  ["c","He ___ late for meetings.",["is never","never is","is not never"],"После be наречие частоты: is never."],
  ["c","We ___ this developer.",["have always trusted","always have trusted","have trusted always"],"Наречие после первого вспомогательного глагола."],
  ["c","Which sentence is correct?",["I really like this area.","I like really this area.","I like this area really much."],"Really стоит перед глаголом; глагол и дополнение рядом."],
  ["b","I will send you the price list tomorrow morning.","Я пришлю вам прайс-лист завтра утром."],
  ["g","They ___ (often / discuss) prices on the phone.",["often discuss"],"Often перед смысловым глаголом."],
  ["t","Переведите: «Мы подписали договор в офисе в понедельник».",["We signed the contract at the office on Monday.","We signed the contract in the office on Monday.","On Monday we signed the contract at the office.","On Monday we signed the contract in the office."],"Кто → действие → что → где → когда."]]},

{id:"g02",lvl:"B1",cat:"s",t:"Как строить вопросы",en:"Question formation",
 sum:"В вопросе вспомогательный глагол выходит вперёд. Исключение — вопрос к подлежащему.",
 rule:["Схема любого вопроса: <b>(вопросительное слово) → вспомогательный → подлежащее → смысловой глагол</b>. Вспомогательный берут из времени: do/does/did, am/is/are, have/has, will, can, would.",
  "<b>Вопрос к подлежащему</b> (кто? что? сколько… сделали?) строится без do/does/did, порядок как в утверждении: <b>Who called</b> you? <b>What happened</b>? <b>How many people came</b>?",
  "Предлог обычно уходит в конец: <b>What</b> are you looking <b>for</b>? <b>Who</b> did you speak <b>to</b>?"],
 scheme:[["Вопр. слово","When"],["Вспомогат.","did"],["Кто","the developer"],["Глагол","start"],["Остальное","the project?"]],
 ex:[["Where do you want to live?","Где вы хотите жить?"],["How long have you been looking for a flat?","Как давно вы ищете квартиру?"],["Who owns this building?","Кто владеет этим зданием?"],["What are you interested in?","Чем вы интересуетесь?"]],
 err:[["Where you want to live?","Where do you want to live?","Нужен вспомогательный do."],["Who did call you?","Who called you?","Вопрос к подлежащему — без did."],["What does it costs?","What does it cost?","После does глагол без -s."]],
 q:[["b","When did the developer start the project?","Когда застройщик начал проект?"],
  ["b","How much does the two-bedroom flat cost?","Сколько стоит квартира с двумя спальнями?"],
  ["c","___ this villa?",["Who designed","Who did design","Who did designed"],"Вопрос к подлежащему: без did."],
  ["c","What ___ about the price?",["did the client say","the client said","said the client"],"Вспомогательный did перед подлежащим."],
  ["c","Which question is correct?",["What are you waiting for?","For what you are waiting?","What you are waiting for?"],"Предлог в конце, are перед you."],
  ["g","How many units ___ (you / sell) last month?",["did you sell"],"Past Simple: did + подлежащее + глагол."],
  ["g","Who ___ (manage) the building now?",["manages","is managing"],"Вопрос к подлежащему: глагол сразу после who."],
  ["b","Have you ever bought property abroad?","Вы когда-нибудь покупали недвижимость за рубежом?"],
  ["c","How long ___ in this area?",["have you lived","you have lived","do you lived"],"Present Perfect: have перед подлежащим."],
  ["t","Спросите: «Что случилось с ценами?»",["What happened to the prices?","What happened to prices?","What has happened to the prices?","What has happened to prices?"],"What — подлежащее, поэтому без did."]]},

{id:"g03",lvl:"B1",cat:"s",t:"Косвенные и вежливые вопросы",en:"Indirect questions",
 sum:"После вежливого вступления вопрос превращается в утверждение: порядок слов прямой.",
 rule:["Прямой вопрос: Where <b>is the office</b>? Вежливый: Could you tell me where <b>the office is</b>? После вступления (Could you tell me…, Do you know…, I'd like to know…, I wonder…) идёт <b>прямой порядок слов</b>, без do/does/did.",
  "Если вопросительного слова нет, ставят <b>if</b> или <b>whether</b>: Do you know <b>if</b> the price includes parking?",
  "Так говорят с клиентами и партнёрами: это звучит мягче и профессиональнее, чем прямой вопрос."],
 scheme:[["Вступление","Could you tell me"],["Вопр. слово / if","when"],["Кто","the building"],["Глагол","will be completed?"]],
 ex:[["Could you tell me how much the service charge is?","Не подскажете, какова плата за обслуживание?"],["Do you know if the flat is still available?","Вы не знаете, квартира ещё свободна?"],["I'd like to know when I can move in.","Я хотел бы знать, когда смогу заехать."],["I wonder why the price has changed.","Интересно, почему изменилась цена."]],
 err:[["Could you tell me where is the office?","Could you tell me where the office is?","Прямой порядок: подлежащее перед глаголом."],["Do you know when does it start?","Do you know when it starts?","Без does."],["I'd like to know do you have parking.","I'd like to know if you have parking.","Нужен if / whether."]],
 q:[["c","Could you tell me where ___?",["the sales office is","is the sales office","does the sales office is"],"Прямой порядок слов."],
  ["c","Do you know ___ the price includes furniture?",["if","what","that if"],"Нет вопросительного слова — ставим if."],
  ["c","I'd like to know when ___.",["the handover takes place","does the handover take place","takes the handover place"],"Без does, подлежащее перед глаголом."],
  ["b","Could you tell me how much the flat costs?","Не подскажете, сколько стоит квартира?"],
  ["b","Do you know whether the developer offers instalments?","Вы не знаете, предлагает ли застройщик рассрочку?"],
  ["g","Do you know what time ___ (the viewing / start)?",["the viewing starts"],"Прямой порядок: the viewing starts."],
  ["g","I wonder why ___ (they / raise) the price last week.",["they raised"],"Без did: they raised."],
  ["c","Can you tell me who ___ for the repairs?",["is responsible","responsible is","does responsible"],"Who — подлежащее: who is responsible."],
  ["b","I would like to know when I can move in.","Я хотел бы знать, когда смогу заехать."],
  ["t","Сделайте вопрос вежливым: «Where is the nearest metro station?» Начните с Could you tell me…",["Could you tell me where the nearest metro station is?"],"После вступления — прямой порядок слов."]]},

{id:"g04",lvl:"B1",cat:"t",t:"Present Perfect или Past Simple",en:"Present Perfect vs Past Simple",
 sum:"Past Simple — законченное действие в законченном времени. Present Perfect — результат или опыт, связанный с настоящим.",
 rule:["<b>Past Simple</b> (did, went): есть точное время в прошлом или оно понятно — yesterday, last year, in 2023, two days ago, when…: We <b>signed</b> the deal <b>last week</b>.",
  "<b>Present Perfect</b> (have/has + V3): время не названо, важен результат сейчас или опыт — already, just, yet, ever, never, so far, this year (год ещё идёт): Prices <b>have risen</b> by 10% this year.",
  "С <b>for</b> и <b>since</b> для ситуаций, которые длятся до сих пор: I <b>have worked</b> here <b>for</b> five years / <b>since</b> 2020. Если подчёркиваем сам процесс — Present Perfect Continuous: I <b>have been working</b> on this deal all week.",
  "В русском оба времени переводятся прошедшим, поэтому смотрите на маркер времени."],
 scheme:[["Кто","The client"],["have / has","has"],["V3","signed"],["Что","the contract"],["Маркер","already"]],
 ex:[["I have just spoken to the developer.","Я только что говорил с застройщиком."],["We sold twelve flats in March.","В марте мы продали двенадцать квартир."],["Have you ever been to Dubai?","Вы когда-нибудь были в Дубае?"],["She has been showing flats since nine o'clock.","Она показывает квартиры с девяти часов."]],
 err:[["I have seen him yesterday.","I saw him yesterday.","Yesterday — законченное время: Past Simple."],["I work here since 2020.","I have worked here since 2020.","С since нужен Present Perfect."],["Did you ever buy a flat abroad?","Have you ever bought a flat abroad?","Опыт за всю жизнь — Present Perfect."]],
 q:[["c","We ___ the contract last Friday.",["signed","have signed","have been signing"],"Last Friday — законченное время."],
  ["c","Prices ___ by 8% so far this year.",["have risen","rose","are rising since"],"So far this year — период не закончился."],
  ["c","I ___ in real estate since 2019.",["have worked","work","worked"],"Since + момент начала → Present Perfect."],
  ["g","___ (you / ever / visit) Phuket?",["Have you ever visited"],"Опыт: Have you ever + V3."],
  ["g","The client ___ (call) two hours ago.",["called"],"Ago → Past Simple."],
  ["g","She ___ (just / send) the documents.",["has just sent"],"Just → Present Perfect."],
  ["c","How long ___ for a flat?",["have you been looking","are you looking","did you look"],"Процесс, который длится до сих пор."],
  ["b","We have already shown this flat to five clients.","Мы уже показали эту квартиру пяти клиентам."],
  ["c","When ___ the deposit?",["did you pay","have you paid","you paid"],"Вопрос When про прошлое → Past Simple."],
  ["t","Переведите: «Я работаю с этим застройщиком три года».",["I have worked with this developer for three years.","I have been working with this developer for three years.","I've worked with this developer for three years.","I've been working with this developer for three years."],"Длится до сих пор: Present Perfect (Continuous) + for."]]},

{id:"g05",lvl:"B1",cat:"t",t:"Времена рассказа",en:"Narrative tenses",
 sum:"Past Simple двигает сюжет, Past Continuous рисует фон, Past Perfect возвращает ещё дальше в прошлое.",
 rule:["<b>Past Simple</b> — цепочка событий: He <b>called</b>, <b>asked</b> about the price and <b>booked</b> a viewing.",
  "<b>Past Continuous</b> (was/were + -ing) — действие, которое было в процессе, когда случилось другое: I <b>was showing</b> the flat <b>when</b> the owner <b>called</b>.",
  "<b>Past Perfect</b> (had + V3) — то, что произошло <b>раньше другого прошедшего</b> события: When we arrived, the buyer <b>had already left</b>.",
  "Маркеры: while, when, as (Continuous); by the time, already, before, after (Perfect)."],
 scheme:[["Раньше","had + V3"],["Фон","was/were + -ing"],["Событие","V2"]],
 ex:[["While we were discussing the price, another buyer made an offer.","Пока мы обсуждали цену, другой покупатель сделал предложение."],["By the time I called, they had sold the last unit.","К тому моменту, как я позвонил, они продали последний лот."],["She was working for a developer when we met.","Она работала у застройщика, когда мы познакомились."]],
 err:[["When I arrived, he already left.","When I arrived, he had already left.","Уехал раньше, чем я приехал: Past Perfect."],["I was signing the contract yesterday at 5.","I signed the contract yesterday at 5.","Короткое завершённое действие — Past Simple."],["While I showed the flat, he called.","While I was showing the flat, he called.","Фоновый процесс — Past Continuous."]],
 q:[["c","While we ___ the site, it started to rain.",["were visiting","visited","had visited"],"Фоновый процесс: Past Continuous."],
  ["c","By the time the bank approved the loan, the price ___.",["had gone up","went up","was going up"],"Раньше другого прошедшего события."],
  ["c","He ___ the contract, paid the deposit and left.",["read","was reading","had read"],"Цепочка событий — Past Simple."],
  ["g","When I got to the office, the meeting ___ (already / start).",["had already started"],"Началась раньше, чем я приехал."],
  ["g","I ___ (talk) to a client when you phoned.",["was talking"],"Процесс в момент звонка."],
  ["b","When we arrived the owner had already left.","Когда мы приехали, собственник уже уехал."],
  ["c","She told me she ___ the flat the day before.",["had seen","saw yet","was seeing"],"The day before → Past Perfect."],
  ["b","I was showing the flat when the owner called.","Я показывал квартиру, когда позвонил собственник."],
  ["g","They ___ (sell) the villa before I saw the listing.",["had sold"],"Продали раньше, чем я увидел объявление."],
  ["c","What ___ at 7 pm yesterday?",["were you doing","did you do","had you done"],"Процесс в конкретный момент прошлого."]]},

{id:"g06",lvl:"B1",cat:"t",t:"Способы говорить о будущем",en:"Future forms",
 sum:"Will, going to, Present Continuous и Present Simple — четыре разных оттенка будущего.",
 rule:["<b>will</b> — решение в момент речи, обещание, прогноз-мнение: I'<b>ll send</b> you the plans right now. I think prices <b>will rise</b>.",
  "<b>be going to</b> — уже принятый план или прогноз по явным признакам: We <b>are going to launch</b> sales in May. Look at the demand — prices <b>are going to</b> grow.",
  "<b>Present Continuous</b> — договорённость с конкретным временем: I <b>am meeting</b> the investor <b>at 3 pm</b> tomorrow.",
  "<b>Present Simple</b> — расписание: The presentation <b>starts</b> at ten.",
  "После <b>when, as soon as, until, before, after, if</b> будущее выражается настоящим: I'll call you <b>when I get</b> the documents (не «when I will get»)."],
 scheme:[["Решение сейчас","will + V"],["План","be going to + V"],["Договорённость","am/is/are + -ing"],["Расписание","V / V-s"]],
 ex:[["I'll check and call you back in ten minutes.","Я уточню и перезвоню вам через десять минут."],["The developer is going to raise prices next month.","Застройщик собирается поднять цены в следующем месяце."],["We are signing the contract on Thursday.","Мы подписываем договор в четверг."],["I'll let you know as soon as the bank confirms.","Я сообщу вам, как только банк подтвердит."]],
 err:[["I will call you when I will arrive.","I will call you when I arrive.","После when — настоящее время."],["I meet the client tomorrow at 5.","I am meeting the client tomorrow at 5.","Личная договорённость — Present Continuous."],["Look at these clouds! It will rain.","Look at these clouds! It is going to rain.","Прогноз по явным признакам — going to."]],
 q:[["c","A: The printer isn't working. B: Don't worry, I ___ it.",["will fix","am going to fix","am fixing"],"Решение принято прямо сейчас."],
  ["c","We ___ a new project next spring: the land is already bought.",["are going to launch","will launch probably","launch"],"План, который уже принят."],
  ["c","I'll send the contract as soon as the lawyer ___ it.",["approves","will approve","is going to approve"],"После as soon as — Present Simple."],
  ["g","The open day ___ (start) at 11 am on Saturday.",["starts"],"Расписание — Present Simple."],
  ["g","I ___ (meet) the investor at 3 pm tomorrow.",["am meeting","'m meeting"],"Договорённость со временем."],
  ["b","I will call you when I get the documents.","Я позвоню вам, когда получу документы."],
  ["c","I think the market ___ next year.",["will recover","is recovering","recovers"],"Прогноз-мнение: I think + will."],
  ["b","We are signing the contract on Thursday morning.","Мы подписываем договор в четверг утром."],
  ["c","If the client ___ today, we'll reserve the flat.",["pays","will pay","is going to pay"],"После if — Present Simple."],
  ["t","Переведите: «Я сообщу вам, как только банк одобрит ипотеку».",["I will let you know as soon as the bank approves the mortgage.","I'll let you know as soon as the bank approves the mortgage.","I will tell you as soon as the bank approves the mortgage.","I'll tell you as soon as the bank approves the mortgage."],"As soon as + Present Simple."]]},

{id:"g07",lvl:"B1",cat:"m",t:"Условные предложения: 0, 1 и 2 тип",en:"Conditionals 0, 1, 2",
 sum:"Реальное условие — настоящее + will. Воображаемое — прошедшее + would.",
 rule:["<b>Нулевой</b> (всегда так): If + Present, Present. If you <b>pay</b> in full, you <b>get</b> a discount.",
  "<b>Первый</b> (реально в будущем): If + Present, will + V. If the bank <b>approves</b> the loan, we <b>will sign</b> next week.",
  "<b>Второй</b> (воображаемое, маловероятное): If + Past, would + V. If I <b>had</b> a million dollars, I <b>would buy</b> a villa. С be — were для всех лиц: If I <b>were</b> you, I would wait.",
  "В части с if никогда не ставят will и would. <b>Unless</b> = if not: We'll lose the flat <b>unless</b> we pay today."],
 scheme:[["If + условие","If the price drops,"],["Результат","we will buy two units."]],
 ex:[["If you book this week, the developer covers the registration fee.","Если забронируете на этой неделе, застройщик покроет регистрационный сбор."],["If I were you, I would choose the higher floor.","На вашем месте я бы выбрал этаж повыше."],["Unless we hurry, someone else will buy it.","Если не поторопимся, её купит кто-то другой."]],
 err:[["If I will see him, I will tell him.","If I see him, I will tell him.","После if — без will."],["If I would have money, I would invest.","If I had money, I would invest.","После if — Past Simple, не would."],["If I was you…","If I were you…","В советах — were."]],
 q:[["c","If the client ___ the deposit today, we will reserve the unit.",["pays","will pay","would pay"],"1 тип: if + Present."],
  ["c","If I ___ you, I would negotiate the price.",["were","am","would be"],"If I were you — устойчивая форма."],
  ["c","If we had a bigger budget, we ___ the penthouse.",["would buy","will buy","bought"],"2 тип: would + V."],
  ["g","We won't get the discount unless we ___ (sign) this month.",["sign"],"Unless = if not, после него Present."],
  ["g","If prices ___ (fall), more people would buy.",["fell"],"2 тип: if + Past Simple."],
  ["b","If I were you I would choose the higher floor.","На вашем месте я бы выбрал этаж повыше."],
  ["c","If you heat water to 100 degrees, it ___.",["boils","will boil probably","would boil"],"Нулевой тип: закон, факт."],
  ["b","If the bank approves the loan we will sign next week.","Если банк одобрит кредит, мы подпишем на следующей неделе."],
  ["c","What would you do if you ___ the lottery?",["won","win","would win"],"Воображаемая ситуация: Past Simple."],
  ["t","Переведите: «На вашем месте я бы подождал».",["If I were you, I would wait.","I would wait if I were you.","If I were you, I'd wait.","I'd wait if I were you."],"If I were you, I would + V."]]},

{id:"g08",lvl:"B1",cat:"m",t:"Модальные глаголы: обязанность, совет, возможность",en:"Modals: obligation, advice, possibility",
 sum:"После модального глагола — инфинитив без to. Отрицания must not и don't have to означают разное.",
 rule:["<b>must</b> / <b>have to</b> — обязан (have to — внешнее правило): Buyers <b>have to</b> pay a 4% transfer fee.",
  "<b>mustn't</b> — запрещено; <b>don't have to</b> — не обязательно: You <b>mustn't</b> sign without reading. You <b>don't have to</b> pay today.",
  "<b>should / ought to</b> — совет: You <b>should</b> check the developer's licence.",
  "<b>may / might / could</b> — возможно: Prices <b>might</b> go up after the launch. <b>can</b> — умение или общая возможность, <b>be able to</b> — для будущего и перфекта: We <b>will be able to</b> move in by June.",
  "Прошедшее: had to, could, was able to (получилось в конкретном случае)."],
 scheme:[["Кто","You"],["Модальный","should"],["Инфинитив без to","check"],["Что","the title deed"]],
 ex:[["You don't have to decide today.","Вам не обязательно решать сегодня."],["Foreign buyers must open a local bank account.","Иностранные покупатели обязаны открыть местный банковский счёт."],["The handover might be delayed.","Передача ключей может задержаться."],["We were able to get a 5% discount.","Нам удалось получить скидку 5%."]],
 err:[["You must to pay.","You must pay.","После must — без to."],["You don't must pay today.","You don't have to pay today.","Не обязательно — don't have to."],["He can to help you.","He can help you.","После can — без to."]],
 q:[["c","You ___ sign anything today. Take your time.",["don't have to","mustn't","haven't to"],"Не обязательно — don't have to."],
  ["c","You ___ transfer money to a personal account. It is against the rules.",["mustn't","don't have to","might not"],"Запрет — mustn't."],
  ["c","I'm not sure, but the price ___ go up next month.",["might","must","has to"],"Возможность — might."],
  ["g","Last year we ___ (have to) wait three months for the permit.",["had to"],"Прошедшее от must / have to — had to."],
  ["c","You ___ ask a lawyer to check the contract. It's a good idea.",["should","mustn't","might to"],"Совет — should."],
  ["b","You do not have to decide today.","Вам не обязательно решать сегодня."],
  ["g","Next year we will ___ (can) offer mortgages.",["be able to"],"После will — be able to."],
  ["b","Foreign buyers must open a local bank account.","Иностранные покупатели обязаны открыть местный банковский счёт."],
