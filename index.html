  ["c","After long negotiations we ___ get a discount.",["were able to","could to","can"],"Получилось в конкретном случае — was/were able to."],
  ["c","___ I see the floor plan, please?",["Could","Must","Should to"],"Вежливая просьба — Could I…?"]]},

{id:"g09",lvl:"B1",cat:"s",t:"Пассивный залог",en:"The passive",
 sum:"Когда важнее объект и результат, а не исполнитель: be + V3.",
 rule:["Формула: <b>be</b> (в нужном времени) + <b>V3</b>. Время показывает только be: is built / was built / has been built / will be built / is being built / can be built.",
  "Пассив нужен, когда исполнитель неизвестен, очевиден или не важен: The building <b>was completed</b> in 2024. В деловых текстах о проектах он встречается постоянно.",
  "Исполнителя добавляют через <b>by</b>: The complex was designed <b>by</b> a British architect.",
  "В русском ему часто соответствует «-ся» или неопределённо-личная форма: «дом сдают», «ключи передадут»."],
 scheme:[["Объект","The keys"],["be","will be"],["V3","handed over"],["Когда / кем","in June"]],
 ex:[["The flats are sold with finishing.","Квартиры продаются с отделкой."],["The foundation has already been laid.","Фундамент уже заложен."],["The second phase is being built now.","Вторая очередь сейчас строится."],["The contract must be signed by both parties.","Договор должен быть подписан обеими сторонами."]],
 err:[["The house built in 2020.","The house was built in 2020.","Нужен глагол be."],["The keys will hand over in June.","The keys will be handed over in June.","will + be + V3."],["The project is build now.","The project is being built now.","Процесс сейчас: is being + V3."]],
 q:[["c","The complex ___ in 2023.",["was completed","completed","has completed"],"Past Simple Passive: was + V3."],
  ["c","The keys ___ to buyers next month.",["will be handed over","will hand over","are handing over"],"Будущее: will be + V3."],
  ["c","The second tower ___ at the moment.",["is being built","is building","builds"],"Процесс сейчас: is being + V3."],
  ["g","All documents ___ (check) by our lawyer last week.",["were checked"],"Past Simple Passive."],
  ["g","Three units ___ (already / sell) this week.",["have already been sold"],"Present Perfect Passive."],
  ["b","The contract must be signed by both parties.","Договор должен быть подписан обеими сторонами."],
  ["c","The villa was designed ___ an Italian architect.",["by","from","with"],"Исполнитель вводится через by."],
  ["b","The flats are sold with finishing and furniture.","Квартиры продаются с отделкой и мебелью."],
  ["g","The payment can ___ (make) in three instalments.",["be made"],"Модальный + be + V3."],
  ["t","Перепишите в пассиве: «They will deliver the project in 2027.»",["The project will be delivered in 2027."],"will be + V3, исполнитель не важен."]]},

{id:"g10",lvl:"B1",cat:"s",t:"Придаточные определительные",en:"Relative clauses",
 sum:"Who, which, that, whose, where склеивают два предложения в одно.",
 rule:["<b>who / that</b> — о людях, <b>which / that</b> — о предметах, <b>whose</b> — чей, <b>where</b> — где: The agent <b>who</b> showed us the flat was very helpful.",
  "<b>Ограничительное</b> придаточное (без запятых) уточняет, о ком именно речь. Если местоимение — дополнение, его можно опустить: The flat <b>(that) we saw</b> yesterday is sold.",
  "<b>Описательное</b> придаточное (в запятых) добавляет информацию. В нём нельзя ставить that и нельзя опускать местоимение: The project<b>, which</b> was launched in May<b>,</b> is 70% sold.",
  "Предлог обычно в конце: the developer <b>(that) we work with</b>. Формально: the developer <b>with whom</b> we work."],
 scheme:[["Главное","This is the flat"],["Связка","that / which"],["Уточнение","has a sea view."]],
 ex:[["The buyers who came yesterday made an offer.","Покупатели, которые приходили вчера, сделали предложение."],["That's the building where our office is.","Это здание, где находится наш офис."],["I spoke to a client whose budget is two million.","Я говорил с клиентом, бюджет которого два миллиона."],["Phuket, which attracts many investors, is growing fast.","Пхукет, который привлекает многих инвесторов, быстро растёт."]],
 err:[["The man which called is my client.","The man who called is my client.","О людях — who."],["The flat what we saw is sold.","The flat that we saw is sold.","What не используется как «который»."],["Dubai, that is very popular, is expensive.","Dubai, which is very popular, is expensive.","В запятых — только which."]],
 q:[["c","The agent ___ showed us the villa speaks Russian.",["who","which","whose"],"О человеке — who."],
  ["c","This is the project ___ we talked about.",["that","who","where"],"О предмете — that / which."],
  ["c","The complex, ___ was completed in 2022, has a pool.",["which","that","what"],"Описательное придаточное в запятых — which."],
  ["c","I have a client ___ budget is unlimited.",["whose","who","which"],"Чей — whose."],
  ["g","That is the district ___ most expats live.",["where","in which"],"Место — where."],
  ["b","The flat that we saw yesterday is already sold.","Квартира, которую мы видели вчера, уже продана."],
  ["c","Which sentence allows you to drop the pronoun?",["The flat (that) I liked is sold.","The flat (that) is near the sea is sold.","The agent (who) called is here."],"Опускать можно, только когда местоимение — дополнение."],
  ["b","The buyers who came yesterday made an offer.","Покупатели, которые приходили вчера, сделали предложение."],
  ["c","The developer ___ is very reliable.",["we work with","which we work","with that we work"],"Местоимение опущено, предлог в конце."],
  ["t","Соедините в одно: «We visited a villa. It has a private beach.»",["We visited a villa that has a private beach.","We visited a villa which has a private beach."],"that / which заменяет it."]]},

{id:"g11",lvl:"B1",cat:"v",t:"Герундий или инфинитив",en:"Gerund or infinitive",
 sum:"После одних глаголов — to do, после других — doing. После предлога всегда -ing.",
 rule:["<b>+ to V</b>: want, plan, decide, hope, agree, offer, promise, refuse, afford, manage, expect, would like: We <b>decided to buy</b>.",
  "<b>+ V-ing</b>: enjoy, avoid, finish, consider, suggest, recommend, mind, keep, risk, postpone, involve: I <b>suggest waiting</b>.",
  "<b>После предлога — только -ing</b>: interested <b>in buying</b>, before <b>signing</b>, instead of <b>renting</b>, look forward <b>to hearing</b> from you.",
  "Смысл меняется: <b>stop to do</b> (остановиться, чтобы) / <b>stop doing</b> (перестать); <b>remember to do</b> (не забыть сделать) / <b>remember doing</b> (помнить, как делал); <b>try to do</b> (стараться) / <b>try doing</b> (попробовать как способ)."],
 scheme:[["Глагол","We decided"],["Форма","to invest"],["Остальное","in Phuket."]],
 ex:[["I look forward to hearing from you.","С нетерпением жду вашего ответа."],["Would you mind sending me the brochure?","Не могли бы вы прислать мне брошюру?"],["They can't afford to buy in the centre.","Они не могут позволить себе купить в центре."],["Have you considered investing abroad?","Вы рассматривали инвестиции за рубежом?"]],
 err:[["I look forward to hear from you.","I look forward to hearing from you.","To здесь предлог → -ing."],["I suggest to wait.","I suggest waiting.","После suggest — герундий."],["We decided buying.","We decided to buy.","После decide — инфинитив."]],
 q:[["c","We decided ___ the offer.",["to accept","accepting","accept"],"decide + to V."],
  ["c","I suggest ___ until the price drops.",["waiting","to wait","wait"],"suggest + V-ing."],
  ["c","I look forward to ___ you at the viewing.",["seeing","see","have seen"],"look forward to + V-ing."],
  ["g","Are you interested in ___ (invest) in Dubai?",["investing"],"После предлога — -ing."],
  ["g","They can't afford ___ (buy) a villa.",["to buy"],"afford + to V."],
  ["c","Please remember ___ your passport to the notary.",["to bring","bringing","bring"],"Не забыть сделать — remember to do."],
  ["b","Would you mind sending me the brochure today?","Не могли бы вы прислать мне брошюру сегодня?"],
  ["g","He avoided ___ (answer) my question about delays.",["answering"],"avoid + V-ing."],
  ["c","Read the contract carefully before ___ it.",["signing","to sign","sign"],"После before — -ing."],
  ["b","Have you considered investing in property abroad?","Вы рассматривали инвестиции в недвижимость за рубежом?"]]},

{id:"g12",lvl:"B1",cat:"d",t:"Артикли a, the и нулевой",en:"Articles",
 sum:"A — один из многих, впервые. The — тот самый, понятно какой. Без артикля — в общем смысле.",
 rule:["<b>a / an</b> — исчисляемое в единственном числе, упоминается впервые или «один из»: We have <b>a</b> flat for you. She is <b>an</b> architect (профессия).",
  "<b>the</b> — конкретный, уже упомянутый, единственный в ситуации: <b>The</b> flat is on <b>the</b> tenth floor. Также: the same, the best, the first, the sea, the centre, the market.",
  "<b>Без артикля</b> — неисчисляемые и множественное число в общем смысле: <b>Property</b> is a good investment. <b>Prices</b> are rising. Также большинство стран, городов, улиц: in Dubai, in Thailand, on Oxford Street.",
  "<b>the</b> с названиями: the UK, the USA, the UAE, the Maldives; реки, моря, океаны (the Thames); отели и музеи (the Hilton).",
  "Исчисляемое существительное в единственном числе не может стоять совсем без определителя: <b>a</b> good location, <b>this</b> project, <b>our</b> office."],
 scheme:[["Впервые","a flat"],["Тот самый","the flat"],["В общем","flats / property"]],
 ex:[["I'm looking for a two-bedroom flat near the sea.","Я ищу квартиру с двумя спальнями у моря."],["The flat we saw yesterday was too small.","Квартира, которую мы видели вчера, была слишком маленькой."],["Investors love stable markets.","Инвесторы любят стабильные рынки."],["She works as a lawyer in the UAE.","Она работает юристом в ОАЭ."]],
 err:[["She is architect.","She is an architect.","Профессия в ед. числе — с a/an."],["The life is expensive in Dubai.","Life is expensive in Dubai.","В общем смысле — без артикля."],["It is best project in city.","It is the best project in the city.","Превосходная степень — the."]],
 q:[["c","We found ___ great villa. ___ villa has four bedrooms.",["a / The","the / A","a / A"],"Впервые — a, затем the."],
  ["c","___ property in the centre is always expensive.",["—","The","A"],"В общем смысле, неисчисляемое — без артикля."],
  ["c","He works as ___ engineer for a developer.",["an","—","the"],"Профессия: an engineer."],
  ["c","It is ___ most popular district among expats.",["the","a","—"],"Превосходная степень — the."],
  ["g","Our office is on ___ third floor.",["the"],"Порядковое числительное — the."],
  ["c","They bought a flat in ___ UAE.",["the","—","an"],"The UAE, the UK, the USA."],
  ["g","I need ___ information about the payment plan. (напишите some или an)",["some"],"Information неисчисляемое: не an."],
  ["c","___ investors usually look for stable income.",["—","The","An"],"Множественное число в общем смысле."],
  ["b","She is the best agent in the company.","Она лучший агент в компании."],
  ["c","Can you close ___ door, please?",["the","a","—"],"Понятно, какая дверь."]]},
{id:"g13",lvl:"B2",cat:"m",t:"Третий тип и смешанные условные",en:"Third & mixed conditionals",
 sum:"Сожаление о прошлом: if + had done, would have done. Смешанный тип соединяет прошлое и настоящее.",
 rule:["<b>Третий тип</b> — прошлое, которое уже не изменить: If + <b>Past Perfect</b>, <b>would have + V3</b>. If we <b>had bought</b> in 2020, we <b>would have doubled</b> our money.",
  "Вместо would можно could have (смог бы) и might have (возможно, …бы).",
  "<b>Смешанный</b>: условие в прошлом → результат сейчас: If I <b>had invested</b> then, I <b>would be</b> rich now. Условие «вообще» → результат в прошлом: If I <b>were</b> more careful, I <b>wouldn't have signed</b> it.",
  "В разговорной речи: If I'd known, I'd have called (первое 'd = had, второе = would)."],
 scheme:[["If + had V3","If we had waited,"],["would have + V3","we would have paid more."]],
 ex:[["If you had told me earlier, I would have reserved the flat.","Если бы вы сказали раньше, я бы забронировал квартиру."],["If the developer hadn't delayed the project, we would be living there now.","Если бы застройщик не задержал проект, мы бы сейчас там жили."],["We could have got a better price if we had negotiated.","Мы могли бы получить цену лучше, если бы поторговались."]],
 err:[["If I would have known, I would have come.","If I had known, I would have come.","После if — Past Perfect, не would have."],["If I knew, I would have come.","If I had known, I would have come.","О прошлом — had known."],["If we had bought, we will be rich.","If we had bought, we would be rich.","Результат — would, не will."]],
 q:[["c","If we ___ the flat in 2020, we would have paid half the price.",["had bought","bought","would have bought"],"Условие о прошлом: Past Perfect."],
  ["c","If you had called me, I ___ you.",["would have helped","would help","had helped"],"Результат в прошлом: would have + V3."],
  ["c","If I had studied finance, I ___ an analyst now.",["would be","would have been","will be"],"Смешанный: результат сейчас — would + V."],
  ["g","We ___ (not / lose) the client if we had answered faster.",["would not have lost","wouldn't have lost"],"would not have + V3."],
  ["g","If the bank ___ (approve) the loan, they would have bought the house.",["had approved"],"If + Past Perfect."],
  ["b","If you had told me earlier I would have reserved the flat.","Если бы вы сказали раньше, я бы забронировал квартиру."],
  ["c","We ___ a discount if we had asked.",["might have got","might get","had got"],"Возможно, получили бы: might have + V3."],
  ["c","If he ___ so stubborn, he would have accepted the offer.",["weren't","hadn't","wouldn't be"],"Смешанный: постоянное качество — Past Simple (were)."],
  ["b","If we had waited we would have paid more.","Если бы мы подождали, мы бы заплатили больше."],
  ["t","Переведите: «Если бы я знал о задержке, я бы вам сказал».",["If I had known about the delay, I would have told you.","If I'd known about the delay, I'd have told you.","If I had known about the delay, I'd have told you.","If I'd known about the delay, I would have told you.","I would have told you if I had known about the delay."],"If + had known, would have told."]]},

{id:"g14",lvl:"B2",cat:"m",t:"Wish, if only, would rather, it's time",en:"Wishes & preferences",
 sum:"После этих выражений время «сдвигается назад»: прошедшая форма говорит о настоящем.",
 rule:["<b>wish / if only + Past Simple</b> — жаль, что сейчас не так: I wish I <b>had</b> more time. I wish prices <b>were</b> lower.",
  "<b>wish / if only + Past Perfect</b> — сожаление о прошлом: I wish I <b>had bought</b> that flat.",
  "<b>wish + would</b> — раздражение, хочу чтобы кто-то изменил поведение: I wish he <b>would answer</b> his phone.",
  "<b>would rather + V</b> (о себе): I'd rather <b>wait</b>. <b>would rather + кто-то + Past</b>: I'd rather <b>you paid</b> by transfer.",
  "<b>It's (high) time + Past</b>: It's time we <b>made</b> a decision."],
 scheme:[["Вступление","I wish"],["Кто","we"],["Форма «назад»","had started"],["Остальное","earlier."]],
 ex:[["I wish I spoke English better.","Жаль, что я не говорю по-английски лучше."],["If only we had signed before the price increase.","Если бы только мы подписали до повышения цены."],["I'd rather you didn't tell the client yet.","Я бы предпочёл, чтобы вы пока не говорили клиенту."],["It's high time we updated the website.","Давно пора обновить сайт."]],
 err:[["I wish I have more money.","I wish I had more money.","О настоящем — Past Simple."],["I wish I bought it last year.","I wish I had bought it last year.","О прошлом — Past Perfect."],["I'd rather you to call him.","I'd rather you called him.","would rather + кто-то + Past."]],
 q:[["c","I wish I ___ more about taxes. I can't answer the client.",["knew","know","would know"],"О настоящем: Past Simple."],
  ["c","I wish we ___ that plot when it was cheap.",["had bought","bought","would buy"],"Сожаление о прошлом: Past Perfect."],
  ["c","I wish the contractor ___ on time for once.",["would arrive","arrives","had arrive"],"Раздражение чужим поведением: would."],
  ["g","I'd rather you ___ (send) the documents by email.",["sent"],"would rather + you + Past."],
  ["g","It's time we ___ (make) a decision.",["made"],"It's time + Past."],
  ["c","I'd rather ___ the contract tomorrow.",["sign","to sign","signed"],"О себе: would rather + V без to."],
  ["b","I wish I had bought that flat last year.","Жаль, что я не купил ту квартиру в прошлом году."],
  ["c","If only the bank ___ faster!",["worked","works","will work"],"If only + Past о настоящем."],
  ["b","It is high time we updated the website.","Давно пора обновить сайт."],
  ["t","Переведите: «Жаль, что я не говорю по-арабски».",["I wish I spoke Arabic.","I wish I could speak Arabic.","If only I spoke Arabic.","If only I could speak Arabic."],"wish + Past Simple."]]},

{id:"g15",lvl:"B2",cat:"m",t:"Модальные глаголы: предположения",en:"Modals of deduction",
 sum:"Must — уверен, что да. Can't — уверен, что нет. Might / could — возможно. О прошлом: + have + V3.",
 rule:["<b>Настоящее</b>: He <b>must be</b> at a viewing (наверняка). He <b>can't be</b> serious (не может быть). She <b>might / could be</b> in a meeting (возможно). О процессе: He <b>must be working</b>.",
  "<b>Прошлое</b>: модальный + <b>have + V3</b>. They <b>must have sold</b> it already. He <b>can't have forgotten</b>. She <b>might have missed</b> the email.",
  "<b>should have + V3</b> — упрёк, следовало сделать: You <b>should have checked</b> the title deed. <b>shouldn't have</b> — не следовало.",
  "<b>needn't have + V3</b> — сделал, но зря: You <b>needn't have brought</b> the originals."],
 scheme:[["Кто","The client"],["Степень уверенности","must / might / can't"],["have + V3","have changed"],["Что","his mind."]],
 ex:[["The price can't be right. It's far too low.","Цена не может быть верной. Она слишком низкая."],["They must have found another agent.","Должно быть, они нашли другого агента."],["We should have asked for a discount.","Нам следовало попросить скидку."],["He might not have received the invoice.","Возможно, он не получил счёт."]],
 err:[["He must to be busy.","He must be busy.","Без to."],["They must sold it.","They must have sold it.","О прошлом: must have + V3."],["It mustn't be true.","It can't be true.","Не может быть — can't."]],
 q:[["c","The lights are off. They ___ gone home.",["must have","must","can't have"],"Вывод о прошлом: must have + V3."],
  ["c","That ___ be the owner. The owner is 70, and this man is 30.",["can't","mustn't","might"],"Уверен, что нет — can't."],
  ["c","I'm not sure where she is. She ___ at lunch.",["might be","must be","can't be"],"Возможно — might."],
  ["g","You ___ (should / read) the contract before signing. Now it's too late.",["should have read"],"Упрёк о прошлом."],
  ["g","He ___ (can't / forget) the meeting. I reminded him twice.",["can't have forgotten","cannot have forgotten"],"Не мог забыть."],
  ["b","They must have found another agent.","Должно быть, они нашли другого агента."],
  ["c","The email ___ lost. Let me resend it.",["may have got","must get","should get"],"Возможно, о прошлом: may have + V3."],
  ["c","You ___ the originals. Copies were enough.",["needn't have brought","mustn't have brought","can't bring"],"Сделал, но зря."],
  ["b","We should have asked for a bigger discount.","Нам следовало попросить скидку побольше."],
  ["c","He's not answering. He ___ a flat right now.",["must be showing","must show","must have show"],"Процесс сейчас: must be + -ing."]]},

{id:"g16",lvl:"B2",cat:"s",t:"Пассив: have something done и It is said that",en:"Advanced passive",
 sum:"Услугу заказывают через have + объект + V3. Мнения и слухи передают безлично.",
 rule:["<b>have / get + объект + V3</b> — не сам, а кто-то для меня: We <b>had the flat valued</b>. I need to <b>get the contract translated</b>.",
  "<b>It is said / believed / expected / reported that…</b>: <b>It is expected that</b> prices will rise.",
  "То же через подлежащее: <b>Prices are expected to rise</b>. О прошлом — <b>to have + V3</b>: The developer <b>is said to have sold</b> 80% of the units.",
  "Глаголы с двумя дополнениями дают два пассива: <b>The buyer was offered</b> a discount / A discount was offered to the buyer. Чаще первый."],
 scheme:[["Кто","We"],["have / get","had"],["Объект","the documents"],["V3","translated"]],
 ex:[["We are having the apartment renovated.","Нам делают ремонт в квартире."],["The project is expected to be completed in 2027.","Ожидается, что проект завершат в 2027 году."],["The company is believed to be planning a new launch.","Считается, что компания планирует новый запуск."],["I was told the price would not change.","Мне сказали, что цена не изменится."]],
 err:[["I translated my passport at the agency. (не сам)","I had my passport translated at the agency.","Услуга: have + объект + V3."],["It is expected prices to rise.","Prices are expected to rise.","Подлежащее + is expected + to V."],["He is said that he is rich.","He is said to be rich.","После is said — инфинитив."]],
 q:[["c","We ___ before we listed it for sale.",["had the flat valued","valued the flat by an expert have","had valued the flat by"],"have + объект + V3."],
  ["c","Prices ___ rise by 10% next year.",["are expected to","are expecting to","expect that"],"Подлежащее + are expected to + V."],
  ["c","The developer is said ___ bankrupt last year.",["to have gone","to go","that went"],"О прошлом: to have + V3."],
  ["g","I need to get this contract ___ (translate) into Russian.",["translated"],"get + объект + V3."],
  ["g","It ___ (believe) that the market has reached its peak.",["is believed"],"It is believed that…"],
  ["b","The project is expected to be completed next year.","Ожидается, что проект завершат в следующем году."],
  ["c","The buyers ___ a 5% discount.",["were offered","were offering","offered to them"],"Пассив с двумя дополнениями."],
  ["b","We are having the apartment renovated this month.","В этом месяце нам делают ремонт в квартире."],
  ["c","She ___ the best broker in the city.",["is considered to be","is considering","considers to be"],"Пассив с глаголом мнения."],
  ["t","Перефразируйте: «People say that the area is very safe.» Начните с The area…",["The area is said to be very safe."],"Подлежащее + is said + to V."]]},

{id:"g17",lvl:"B2",cat:"t",t:"Future Continuous и Future Perfect",en:"Future Continuous & Future Perfect",
 sum:"Что будет в процессе в момент X и что будет завершено к моменту X.",
 rule:["<b>Future Continuous</b>: will be + -ing — процесс в определённый момент будущего: This time next week I <b>will be presenting</b> the project in Dubai. Также вежливый вопрос о планах: <b>Will you be using</b> the car park?",
  "<b>Future Perfect</b>: will have + V3 — действие завершится <b>к</b> сроку: <b>By</b> the end of the year we <b>will have sold</b> all the units.",
  "<b>Future Perfect Continuous</b>: will have been + -ing — сколько будет длиться к моменту: By May I <b>will have been working</b> here for ten years.",
  "Маркеры: by + срок, by the time, this time next…, in five years' time."],
 scheme:[["By + срок","By 2028"],["Кто","the developer"],["will have + V3","will have completed"],["Что","all three phases."]],
 ex:[["By the time you arrive, I will have prepared all the papers.","К вашему приезду я подготовлю все бумаги."],["Don't call at ten. I'll be showing a flat.","Не звоните в десять. Я буду показывать квартиру."],["In two years' time the metro will have reached this district.","Через два года метро дойдёт до этого района."]],
 err:[["By Friday I will finish the report.","By Friday I will have finished the report.","К сроку — Future Perfect."],["By the time you will arrive…","By the time you arrive…","После by the time — Present."],["At 5 pm I will have a meeting with them (в процессе).","At 5 pm I will be having a meeting with them.","Процесс в момент — will be + -ing."]],
 q:[["c","By December the developer ___ the first phase.",["will have completed","will be completing","completes"],"К сроку — will have + V3."],
  ["c","This time tomorrow we ___ to Phuket.",["will be flying","will have flown","fly"],"Процесс в момент будущего."],
  ["c","By the time the client ___, we will have prepared everything.",["arrives","will arrive","will have arrived"],"После by the time — Present Simple."],
  ["g","By next year prices ___ (rise) by at least 15%.",["will have risen"],"К сроку: will have risen."],
  ["g","At 3 pm I ___ (meet) the investors, so I can't talk.",["will be meeting","'ll be meeting"],"Процесс в момент: will be meeting."],
  ["b","By the end of the year we will have sold all the units.","К концу года мы продадим все лоты."],
  ["c","By June I ___ here for five years.",["will have been working","will be working","am working"],"Длительность к моменту в будущем."],
  ["c","___ the meeting room this afternoon?",["Will you be using","Will you have used","Do you will use"],"Вежливый вопрос о планах."],
  ["b","This time next week I will be presenting the project.","В это время на следующей неделе я буду презентовать проект."],
  ["t","Переведите: «К концу месяца мы подпишем десять договоров».",["By the end of the month we will have signed ten contracts.","We will have signed ten contracts by the end of the month.","By the end of the month we'll have signed ten contracts.","We'll have signed ten contracts by the end of the month."],"By + срок → Future Perfect."]]},

{id:"g18",lvl:"B2",cat:"t",t:"Used to, would, be used to, get used to",en:"Used to & habits",
 sum:"Used to do — раньше было так. Be used to doing — привык. Get used to doing — привыкаю.",
 rule:["<b>used to + V</b> — прошлая привычка или состояние, которых больше нет: This area <b>used to be</b> industrial. Вопрос и отрицание: Did you <b>use to</b>…? / didn't <b>use to</b>.",
  "<b>would + V</b> — только повторяющиеся действия в прошлом, не состояния: Every Friday we <b>would visit</b> the site. Нельзя: <s>It would be cheap</s>.",
  "<b>be used to + существительное / -ing</b> — привык, это нормально: I <b>am used to working</b> with foreign clients.",
  "<b>get used to + -ing</b> — процесс привыкания: You will <b>get used to driving</b> on the left."],
 scheme:[["Раньше","used to + V"],["Привык","be used to + V-ing"],["Привыкаю","get used to + V-ing"]],
 ex:[["Prices here used to be much lower.","Цены здесь раньше были гораздо ниже."],["I'm not used to negotiating in English yet.","Я ещё не привык вести переговоры на английском."],["It took me a year to get used to the heat.","Мне понадобился год, чтобы привыкнуть к жаре."]],
 err:[["I am used to work late.","I am used to working late.","be used to + -ing."],["I use to live in Moscow.","I used to live in Moscow.","В утверждении — used to."],["This would be a quiet area.","This used to be a quiet area.","Состояние — used to, не would."]],
 q:[["c","This district ___ full of factories.",["used to be","was used to be","would be"],"Прошлое состояние — used to."],
  ["c","I'm used to ___ with demanding clients.",["dealing","deal","dealt"],"be used to + -ing."],
  ["c","Did you ___ work for a developer?",["use to","used to","using to"],"После did — use to."],
  ["g","Don't worry, you will get used to ___ (drive) on the left.",["driving"],"get used to + -ing."],
  ["g","When I started, I ___ (not / use) to speak English at work.",["did not use","didn't use"],"Отрицание: didn't use to."],
  ["b","Prices here used to be much lower.","Цены здесь раньше были гораздо ниже."],
  ["c","Every summer we ___ to the same resort.",["would go","were used to go","use to going"],"Повторяющееся действие в прошлом — would."],
  ["c","She has lived in Dubai for years, so she ___ the heat.",["is used to","used to","gets use to"],"Привыкла — is used to."],
  ["b","I am not used to negotiating in English yet.","Я ещё не привык вести переговоры на английском."],
  ["c","It took me months to ___ the new CRM.",["get used to","be use to","used to"],"Процесс привыкания — get used to."]]},

{id:"g19",lvl:"B2",cat:"s",t:"Косвенная речь и глаголы передачи",en:"Reported speech",
 sum:"Передавая чужие слова, сдвигаем время назад и меняем местоимения. Точнее всего — глаголы с нужной конструкцией.",
 rule:["Сдвиг времён: is → was, will → would, did / has done → had done, can → could, must → had to. He said the flat <b>was</b> available. She said she <b>would</b> call.",
  "Если это всё ещё правда, сдвиг необязателен: He said the office <b>is</b> on Tverskaya.",
  "<b>say</b> (что) / <b>tell</b> (кому): He <b>said</b> that… / He <b>told me</b> that…",
  "Вопрос — прямой порядок слов: He asked <b>where I lived</b>. He asked <b>if</b> I had a budget. Просьба: asked me <b>to wait</b>; told me <b>not to worry</b>.",
  "Глаголы передачи: <b>offer / promise / agree / refuse + to V</b>; <b>advise / remind / warn / encourage + кого + to V</b>; <b>suggest / recommend / admit / deny + V-ing</b>; <b>apologise for + V-ing</b>."],
 scheme:[["Кто","The agent"],["Глагол передачи","promised"],["Форма","to send"],["Что","the plans."]],
 ex:[["The client asked whether the price included parking.","Клиент спросил, включена ли в цену парковка."],["She told me the deal had been approved.","Она сказала мне, что сделку одобрили."],["The lawyer advised us not to sign.","Юрист посоветовал нам не подписывать."],["He denied receiving the email.","Он отрицал, что получил письмо."]],
 err:[["He said me that…","He told me that…","say — без «кому»; tell — с «кому»."],["She asked where did I live.","She asked where I lived.","Прямой порядок слов."],["He suggested to wait.","He suggested waiting.","suggest + V-ing."]],
 q:[["c","The developer ___ us that the building would be ready in May.",["told","said","explained us"],"tell + кому."],
  ["c","She asked me how much ___.",["the flat cost","did the flat cost","cost the flat did"],"В косвенном вопросе — прямой порядок."],
  ["c","He said he ___ the documents the next day.",["would send","will send","sends"],"will → would."],
  ["g","The lawyer advised us ___ (not / sign) the contract.",["not to sign"],"advise + кого + not to V."],
  ["g","The agent suggested ___ (wait) until the launch.",["waiting"],"suggest + V-ing."],
  ["b","The client asked whether the price included parking.","Клиент спросил, включена ли в цену парковка."],
  ["c","The manager apologised ___ late.",["for being","to be","that he is"],"apologise for + V-ing."],
  ["c","He ___ to give us a discount.",["refused","denied","suggested"],"refuse + to V."],
  ["b","She told me the deal had been approved.","Она сказала мне, что сделку одобрили."],
  ["t","Передайте: «I will call you tomorrow», — he said. Начните с He said…",["He said he would call me the next day.","He said that he would call me the next day.","He said he would call me the following day.","He said that he would call me the following day."],"will → would, tomorrow → the next day."]]},

{id:"g20",lvl:"B2",cat:"c",t:"Связки: уступка, причина, цель, результат",en:"Linking: contrast, cause, purpose, result",
 sum:"Одна и та же мысль строится по-разному после although и despite, because и because of.",
 rule:["<b>Уступка</b>: although / even though / while + <b>предложение</b>; despite / in spite of + <b>существительное или -ing</b>. <b>Although</b> the price is high, demand is strong = <b>Despite</b> the high price, demand is strong. Отдельным предложением: However, … / Nevertheless, …",
  "<b>Причина</b>: because / since / as + предложение; because of / due to / owing to + существительное: The launch was delayed <b>due to</b> bad weather.",
  "<b>Цель</b>: to / in order to / so as to + V; so that + подлежащее + can / could / would: We lowered the price <b>so that</b> more people <b>could</b> afford it.",
  "<b>Результат</b>: so + прилагательное + that; such + (a) + существительное + that; therefore, as a result, consequently."],
 scheme:[["Связка","Despite"],["Существительное / -ing","the delay,"],["Главное","all units were sold."]],
 ex:[["Even though the market slowed down, we met our targets.","Хотя рынок замедлился, мы выполнили план."],["The project was so popular that it sold out in a week.","Проект был настолько популярен, что его раскупили за неделю."],["In spite of being expensive, the villa was sold quickly.","Несмотря на высокую цену, виллу быстро продали."],["We met early in order to avoid traffic.","Мы встретились рано, чтобы избежать пробок."]],
 err:[["Despite the price is high…","Despite the high price… / Although the price is high…","После despite — существительное или -ing."],["Because of it was raining…","Because it was raining… / Because of the rain…","because of + существительное."],["It was so good project that…","It was such a good project that…","such + a + прилагательное + существительное."]],
 q:[["c","___ the high price, the flat was sold in a day.",["Despite","Although","However"],"Перед существительным — despite."],
  ["c","___ the location is excellent, the building needs repairs.",["Although","Despite","In spite"],"Перед предложением — although."],
  ["c","The handover was postponed ___ a delay in permits.",["due to","because","so that"],"Перед существительным — due to."],
  ["g","We sent a car ___ (чтобы) that the client could get to the site.",["so"],"so that + could."],
  ["c","It was ___ successful launch that prices rose twice.",["such a","so","such"],"such a + прилагательное + существительное."],
  ["b","Despite the delay all units were sold.","Несмотря на задержку, все лоты были проданы."],
  ["c","The price was ___ high that nobody made an offer.",["so","such","too much"],"so + прилагательное + that."],
  ["g","In spite of ___ (be) new to the market, she closed five deals.",["being"],"in spite of + -ing."],
  ["b","We met early in order to avoid traffic.","Мы встретились рано, чтобы избежать пробок."],
  ["t","Перефразируйте с Although: «Despite the rain, we visited the site.»",["Although it was raining, we visited the site.","Although it rained, we visited the site."],"Although + подлежащее + глагол."]]},

{id:"g21",lvl:"B2",cat:"d",t:"Сравнения: от «чуть» до «гораздо»",en:"Comparison structures",
 sum:"Усилители, двойные сравнения и as… as делают сравнение точным.",
 rule:["Степень разницы: <b>much / far / a lot / considerably</b> + сравнительная (гораздо); <b>slightly / a bit / a little</b> + сравнительная (немного): Phuket is <b>far cheaper</b> than Dubai.",
  "<b>as + прилагательное + as</b> — такой же; not as… as — не такой; <b>twice / three times as… as</b>: This flat is <b>twice as expensive as</b> that one.",
  "<b>The + сравнительная, the + сравнительная</b>: <b>The earlier</b> you invest, <b>the higher</b> the return.",
  "Постепенное изменение: Prices are getting <b>higher and higher</b> / <b>more and more</b> expensive.",
  "Превосходная: <b>by far the</b> best; <b>one of the most</b> popular areas; the second largest."],
 scheme:[["The + сравн.","The closer to the sea,"],["the + сравн.","the higher the price."]],
 ex:[["The new project is considerably more expensive than the old one.","Новый проект значительно дороже старого."],["It isn't nearly as crowded as the city centre.","Здесь далеко не так многолюдно, как в центре."],["The longer you wait, the more you will pay.","Чем дольше ждёте, тем больше заплатите."],["This is by far the best offer on the market.","Это, безусловно, лучшее предложение на рынке."]],
 err:[["It is more cheaper.","It is cheaper. / It is much cheaper.","Нельзя more + -er."],["The more early you invest, more you get.","The earlier you invest, the more you get.","The + сравнительная в обеих частях."],["It is twice more expensive than…","It is twice as expensive as…","twice as… as."]],
 q:[["c","Villas here are ___ more expensive than flats.",["far","very","more"],"Усилитель сравнения: far / much."],
  ["c","The second flat is ___ as the first one.",["twice as big","twice bigger than","two times big"],"twice as + прилагательное + as."],
  ["c","The closer to the metro, ___ the rent.",["the higher","higher","the highest"],"The… the…"],
  ["g","This district is ___ (slightly / quiet) than the centre.",["slightly quieter"],"slightly + сравнительная."],
  ["g","It is by far the ___ (good) location in the city.",["best"],"by far the best."],
  ["b","The longer you wait the more you will pay.","Чем дольше вы ждёте, тем больше заплатите."],
  ["c","Flats are getting ___ expensive.",["more and more","more and most","the more"],"Постепенное изменение."],
  ["c","It's not ___ expensive as I expected.",["as","so much","than"],"not as… as."],
  ["b","This is one of the most popular areas among investors.","Это один из самых популярных районов среди инвесторов."],
  ["c","Phuket is the second ___ market for Russian buyers.",["largest","larger","most large"],"the second + превосходная."]]},

{id:"g22",lvl:"B2",cat:"s",t:"Причастные обороты",en:"Participle clauses",
 sum:"-ing и V3 сжимают придаточное: текст звучит плотнее и профессиональнее.",
 rule:["<b>-ing</b> заменяет активное придаточное: The complex <b>overlooking</b> the bay (= which overlooks). Buyers <b>looking</b> for rental income prefer studios.",
  "<b>V3</b> заменяет пассивное: The villa <b>built</b> in 2019 (= which was built). The units <b>sold</b> last month…",
  "В начале предложения оборот относится к подлежащему: <b>Located</b> near the beach, the hotel attracts tourists. <b>Having signed</b> the contract, we paid the deposit (сначала одно, потом другое).",
  "Ошибка «висячего» оборота: <s>Walking to the office, the rain started</s>. У оборота и главного предложения должно быть одно подлежащее."],
 scheme:[["Оборот","Located in the centre,"],["Подлежащее","the hotel"],["Сказуемое","attracts business travellers."]],
 ex:[["Designed by a famous architect, the tower became a landmark.","Спроектированная известным архитектором, башня стала достопримечательностью."],["We offer flats overlooking the park.","Мы предлагаем квартиры с видом на парк."],["Having compared three projects, they chose the second one.","Сравнив три проекта, они выбрали второй."],["Not knowing the area, I asked for advice.","Не зная района, я попросил совета."]],
 err:[["The flat locating in the centre…","The flat located in the centre…","Квартира «расположена» — пассив, V3."],["Buyers interesting in rental income…","Buyers interested in rental income…","interested — заинтересованные."],["Walking home, my phone rang.","While I was walking home, my phone rang.","Подлежащее должно совпадать."]],
 q:[["c","The apartments ___ the sea are the most expensive.",["overlooking","overlooked","which overlooking"],"Активное значение — -ing."],
  ["c","___ in 2021, the complex has two pools.",["Completed","Completing","Having complete"],"Пассивное значение — V3."],
  ["c","___ the documents, the lawyer approved the deal.",["Having checked","Checked","Being check"],"Сначала проверил: having + V3."],
  ["g","Clients ___ (interest) in investment usually ask about yield.",["interested"],"interested in — V3."],
  ["g","We have several villas ___ (build) by this developer.",["built"],"Пассив: built."],
  ["b","Located near the beach the hotel attracts tourists.","Расположенный рядом с пляжем, отель привлекает туристов."],
  ["c","Which sentence is correct?",["Walking around the site, we noticed some cracks.","Walking around the site, some cracks were noticed.","Walked around the site, we noticed some cracks."],"Подлежащее оборота = подлежащее главного предложения."],
  ["c","Not ___ the language, he hired an interpreter.",["knowing","known","to knowing"],"Причина: not + -ing."],
  ["b","We offer flats overlooking the park.","Мы предлагаем квартиры с видом на парк."],
  ["t","Сократите: «The villa which was sold last week had a private beach.»",["The villa sold last week had a private beach."],"which was sold → sold."]]},
{id:"g23",lvl:"C1",cat:"s",t:"Инверсия после отрицательных наречий",en:"Negative inversion",
 sum:"Never, rarely, not only, no sooner в начале предложения требуют порядка слов как в вопросе.",
 rule:["Если предложение начинается с отрицательного или ограничительного выражения, дальше идёт <b>вспомогательный глагол → подлежащее</b>: <b>Never have I seen</b> such demand. Это формальный, выразительный стиль: презентации, отчёты, выступления.",
  "Выражения: never, rarely, seldom, hardly… when, no sooner… than, not only… but also, under no circumstances, at no time, on no account, little, only then, only after / when / by…, not until.",
  "В Present / Past Simple появляется do / does / did: <b>Rarely does</b> a project sell out so fast. <b>Not only did</b> they lower the price, but they also offered instalments.",
  "С only after / not until инверсия во <b>второй</b> части: Only after we signed <b>did we learn</b> about the fee."],
 scheme:[["Отрицание","Never before"],["Вспомогат.","has"],["Кто","the market"],["Глагол","grown"],["Остальное","so fast."]],
 ex:[["Not only is the location excellent, but the price is also competitive.","Мало того что расположение отличное, так ещё и цена конкурентная."],["No sooner had we launched sales than the first phase sold out.","Едва мы открыли продажи, как первую очередь раскупили."],["Under no circumstances should you transfer money without a contract.","Ни при каких обстоятельствах не переводите деньги без договора."],["Only then did I understand the risk.","Только тогда я понял риск."]],
 err:[["Never I have seen such prices.","Never have I seen such prices.","После never — вспомогательный перед подлежащим."],["Not only they lowered the price…","Not only did they lower the price…","Нужен did."],["Only after signing we learned…","Only after signing did we learn…","Инверсия во второй части."]],
 q:[["c","Never ___ such strong demand.",["have we seen","we have seen","we saw"],"После never — have перед подлежащим."],
  ["c","Not only ___ the price, but they also added free parking.",["did they cut","they cut","they did cut"],"Past Simple → did + подлежащее."],
  ["c","No sooner ___ the listing than three buyers called.",["had we published","we had published","did we published"],"No sooner + had + подлежащее + V3."],
  ["g","Rarely ___ (a project / sell) out in a week.",["does a project sell"],"Present Simple → does + подлежащее + V."],
  ["g","Under no circumstances ___ (you / should / sign) a blank form.",["should you sign"],"Модальный перед подлежащим."],
  ["b","Not only is the location excellent but the price is competitive.","Мало того что расположение отличное, так ещё и цена конкурентная."],
  ["c","Only after the inspection ___ the defect.",["did we notice","we noticed","noticed we"],"Инверсия в главной части."],
  ["c","Hardly ___ the office when the client called.",["had I reached","I had reached","did I reached"],"Hardly + had + подлежащее."],
  ["b","Only then did I understand the real risk.","Только тогда я понял реальный риск."],
  ["t","Усильте: «I have never seen such a beautiful villa.» Начните с Never…",["Never have I seen such a beautiful villa."],"Never + have + I + V3."]]},

{id:"g24",lvl:"C1",cat:"m",t:"Условия без if: should, were, had",en:"Conditional inversion & alternatives to if",
 sum:"В формальной речи if опускают и выносят вперёд should, were или had.",
 rule:["<b>Should you</b> need… = If you should need / If you need (вежливо, деловая переписка): <b>Should you have</b> any questions, please contact me.",
  "<b>Were I / Were we to</b>… = If I were / If we were to: <b>Were the price to fall</b>, we would buy more.",
  "<b>Had I known</b>… = If I had known: <b>Had we invested</b> earlier, we would have earned more.",
  "Отрицание без сокращений: <b>Had it not been</b> for the delay… (не Hadn't it been).",
  "Другие замены if: <b>provided / providing (that)</b>, <b>as long as</b> (при условии что), <b>unless</b> (если не), <b>in case</b> (на случай), <b>but for</b> + существительное (если бы не), <b>supposing</b>, <b>otherwise</b>."],
 scheme:[["Should / Were / Had","Should"],["Кто","you"],["Глагол","require"],["Остальное","further details, …"]],
 ex:[["Should you require any further information, do not hesitate to contact us.","Если вам потребуется дополнительная информация, обращайтесь."],["Had it not been for the agent, we would have overpaid.","Если бы не агент, мы бы переплатили."],["Were I in your position, I would diversify.","Будь я на вашем месте, я бы диверсифицировал вложения."],["You can cancel provided that you give 30 days' notice.","Вы можете отказаться при условии уведомления за 30 дней."]],
 err:[["Had I knew…","Had I known…","Had + подлежащее + V3."],["Should you will need…","Should you need…","После should — инфинитив."],["Hadn't it been for you…","Had it not been for you…","В инверсии отрицание не сокращают."]],
 q:[["c","___ you need any assistance, our team is available 24/7.",["Should","Would","Had"],"Should you need = If you need."],
  ["c","___ we known about the tax, we would have chosen another structure.",["Had","Should","Were"],"3 тип: Had + подлежащее + V3."],
  ["c","___ the developer to go bankrupt, the escrow account would protect buyers.",["Were","Had","Should have"],"2 тип: Were + подлежащее + to V."],
  ["g","Had it not ___ (be) for the discount, we wouldn't have bought.",["been"],"Had it not been for…"],
  ["c","We will reserve the unit ___ you pay the deposit by Friday.",["provided that","unless that","in case of"],"При условии что."],
  ["b","Should you have any questions please contact me.","Если у вас возникнут вопросы, пожалуйста, свяжитесь со мной."],
  ["c","___ the agent's advice, we would have lost money.",["But for","Unless","Provided"],"But for + существительное = если бы не."],
  ["c","Take a copy of your passport ___ the notary asks for it.",["in case","unless","provided"],"На случай если."],
  ["b","Had we invested earlier we would have earned more.","Если бы мы вложились раньше, мы бы заработали больше."],
  ["t","Перепишите без if: «If I had known about the fee, I would have told you.»",["Had I known about the fee, I would have told you.","Had I known about the fee, I'd have told you."],"Had + I + V3."]]},

{id:"g25",lvl:"C1",cat:"s",t:"Расщеплённые предложения",en:"Cleft sentences",
 sum:"It is… that и What… is выносят главное в фокус, как интонация в русском.",
 rule:["<b>It is / was + фокус + that / who</b>: <b>It was the location that</b> convinced them (именно расположение). <b>It is in March that</b> prices usually rise.",
  "<b>What + придаточное + is / was</b>: <b>What we need is</b> a clear timeline. <b>What I like about this project is</b> the view. Если фокус — действие: <b>What they did was (to) lower</b> the price.",
  "<b>The thing / The reason / The place / All</b>: <b>The reason (why)</b> we chose Phuket <b>is that</b> yields are higher. <b>All I want is</b> a straight answer.",
  "В русском ту же роль играют «именно», «как раз», «единственное, что»."],
 scheme:[["What + придаточное","What buyers want"],["is / was","is"],["Фокус","a reliable developer."]],
 ex:[["It's the service charge that worries me, not the price.","Меня беспокоит именно плата за обслуживание, а не цена."],["What makes this area special is its infrastructure.","Что делает этот район особенным, так это инфраструктура."],["The reason I'm calling is that the bank has approved your loan.","Я звоню потому, что банк одобрил ваш кредит."],["All you have to do is sign here.","Всё, что вам нужно сделать, — подписать здесь."]],
 err:[["It was the location what convinced them.","It was the location that convinced them.","В it-расщеплении — that / who."],["What we need it is time.","What we need is time.","Без лишнего it."],["The reason is because…","The reason is that…","The reason is that."]],
 q:[["c","It was the sea view ___ sold the flat.",["that","what","which it"],"It was… that."],
  ["c","___ I like most about this project is the layout.",["What","That","It"],"What + придаточное + is."],
  ["c","The reason we raised the price ___ demand was too high.",["is that","is because of","it is"],"The reason… is that."],
  ["g","What the client wants ___ a fixed price.",["is"],"What… is."],
  ["g","It was in 2022 ___ the market peaked.",["that","when"],"It was + время + that."],
  ["b","What we need is a clear timeline.","Что нам нужно, так это чёткий график."],
  ["c","What they did ___ the launch by a month.",["was postpone","was postponing","did postpone"],"Фокус на действии: was (to) + V."],
  ["c","All I ___ is a straight answer.",["want","wanted it","am want"],"All I want is…"],
  ["b","It was the location that convinced them.","Их убедило именно расположение."],
  ["t","Выделите подлежащее: «The price worries me.» Начните с It is…",["It is the price that worries me.","It's the price that worries me."],"It is + фокус + that."]]},

{id:"g26",lvl:"C1",cat:"v",t:"Сослагательное наклонение и формальные конструкции",en:"The subjunctive & formal structures",
 sum:"После insist, recommend, essential в формальной речи — «голый» инфинитив для всех лиц.",
 rule:["После глаголов требования и совета — <b>that + подлежащее + V</b> (без -s, без времени): The bank <b>insists that</b> the buyer <b>provide</b> proof of funds. We <b>recommend that</b> he <b>sign</b> today.",
  "Глаголы: suggest, recommend, insist, demand, request, propose, require. Прилагательные: It is <b>essential / vital / important / necessary that</b> every document <b>be</b> notarised.",
  "Отрицание — not перед глаголом: We recommend that you <b>not sign</b> yet. Пассив — be + V3: …that the contract <b>be reviewed</b>.",
  "В британском английском часто добавляют should: …insists that the buyer <b>should provide</b>…",
  "Застывшие формулы: If need be; Be that as it may; So be it; Suffice it to say; as it were."],
 scheme:[["Требование","The lawyer recommends"],["that","that"],["Кто","the client"],["V без -s","sign"],["Остальное","after the inspection."]],
 ex:[["The developer requires that all payments be made by bank transfer.","Застройщик требует, чтобы все платежи шли банковским переводом."],["It is essential that the buyer attend the handover in person.","Важно, чтобы покупатель лично присутствовал на передаче ключей."],["I suggest that she speak to a tax adviser first.","Я предлагаю ей сначала поговорить с налоговым консультантом."]],
 err:[["I suggest that he signs today.","I suggest that he sign today.","В формальной речи — без -s."],["It is vital that the report is ready.","It is vital that the report be ready.","be для всех лиц."],["They demanded us to pay.","They demanded that we pay.","demand + that + подлежащее + V."]],
 q:[["c","The bank insists that the buyer ___ proof of income.",["provide","provides","to provide"],"Сослагательное: без -s."],
  ["c","It is essential that every page ___ signed.",["be","is being","to be"],"be для всех лиц."],
  ["c","We recommend that you ___ the deposit until the check is done.",["not pay","don't pay","not to pay"],"Отрицание: not + V."],
  ["g","The contract requires that the tenant ___ (give) two months' notice.",["give","should give"],"that + подлежащее + V."],
  ["g","I propose that the meeting ___ (postpone) until Monday.",["be postponed","should be postponed"],"Пассив: be + V3."],
  ["b","It is essential that the buyer attend the handover in person.","Важно, чтобы покупатель лично присутствовал на передаче ключей."],
  ["c","We can extend the deadline, if need ___.",["be","is","will be"],"Устойчивое выражение if need be."],
  ["c","The seller demanded that the deposit ___ within three days.",["be paid","is paid","will pay"],"that + be + V3."],
  ["b","I suggest that she speak to a tax adviser first.","Я предлагаю ей сначала поговорить с налоговым консультантом."],
  ["c","Which is the most formal?",["We request that he reply by Friday.","We want him to reply by Friday.","He has to reply by Friday."],"request that + V."]]},

{id:"g27",lvl:"C1",cat:"c",t:"Осторожные формулировки",en:"Hedging & distancing",
 sum:"Профессионалы редко говорят «точно». Они говорят «по-видимому», «как правило», «есть основания полагать».",
 rule:["Глаголы-смягчители: <b>seem / appear + to V</b>, <b>tend to + V</b> (как правило): Prices <b>tend to rise</b> after the launch. The market <b>appears to be</b> slowing.",
  "Модальные: may, might, could, would: This <b>could suggest</b> a shift in demand. I <b>would say</b> that…",
  "Наречия и рамки: apparently, arguably, presumably, reportedly, to some extent, in most cases, as a rule, broadly speaking.",
  "Безличные конструкции: <b>It seems / appears that…</b>, <b>It is believed / thought / estimated that…</b>, <b>There seems to be</b> a problem.",
  "Так делают прогнозы, не обещая лишнего, и критикуют, не обижая: There <b>seems to be</b> a mistake in the invoice вместо You made a mistake."],
 scheme:[["Кто / что","Yields"],["Смягчитель","tend to"],["Глагол","be higher"],["Рамка","in tourist areas."]],
 ex:[["It would appear that the developer is behind schedule.","По всей видимости, застройщик отстаёт от графика."],["Demand is likely to remain strong, at least in the short term.","Спрос, вероятно, останется высоким, по крайней мере в краткосрочной перспективе."],["This is arguably the best location on the island.","Пожалуй, это лучшее расположение на острове."],["There seems to be a misunderstanding about the payment date.","Похоже, возникло недопонимание по дате платежа."]],
 err:[["Prices tend rising.","Prices tend to rise.","tend + to V."],["It seems that to be a problem.","There seems to be a problem.","There seems to be…"],["The market is seeming weak.","The market seems weak.","seem не используется в Continuous."]],
 q:[["c","Rental yields ___ be higher in tourist areas.",["tend to","tend","are tending"],"tend to + V."],
  ["c","There ___ to be an error in the contract.",["seems","is seeming","seem that"],"There seems to be…"],
  ["c","Prices are ___ to stabilise next year.",["likely","probably","possible"],"be likely to + V."],
  ["g","The developer appears ___ (underestimate) the costs. (о прошлом)",["to have underestimated"],"appear + to have + V3."],
  ["g","It is ___ (estimate) that 40% of buyers are investors.",["estimated"],"It is estimated that…"],
  ["b","There seems to be a misunderstanding about the payment date.","Похоже, возникло недопонимание по дате платежа."],
  ["c","Which sentence is the most cautious?",["This might suggest that demand is cooling.","This proves that demand is cooling.","Demand is cooling."],"might suggest — двойное смягчение."],
  ["c","This is ___ the most promising district in the city.",["arguably","argue","arguing"],"arguably — «пожалуй»."],
  ["b","The market appears to be slowing down.","Рынок, по-видимому, замедляется."],
  ["t","Смягчите: «You made a mistake in the invoice.» Начните с There seems…",["There seems to be a mistake in the invoice."],"There seems to be + существительное."]]},

{id:"g28",lvl:"C1",cat:"c",t:"Номинализация: деловой стиль",en:"Nominalisation",
 sum:"В отчётах и письмах действия превращают в существительные: текст становится плотнее и нейтральнее.",
 rule:["Разговорно: Prices <b>rose sharply</b>, so buyers <b>worried</b>. Формально: <b>The sharp rise</b> in prices caused <b>concern</b> among buyers.",
  "Глагол → существительное: decide → decision, grow → growth, complete → completion, approve → approval, fail → failure, deliver → delivery, assess → assessment, acquire → acquisition.",
  "Наречие становится прилагательным: rose <b>sharply</b> → a <b>sharp</b> rise. Исполнитель вводится через of / by: <b>the completion of</b> the project <b>by</b> the developer.",
  "Устойчивые пары: make a decision, reach an agreement, give approval, carry out an inspection, take into consideration, have an impact on.",
  "Не перегружайте: одна-две номинализации на предложение."],
 scheme:[["Было","The developer delayed the project."],["Стало","The delay of the project…"],["Что дальше","…led to complaints."]],
 ex:[["The completion of the second phase is scheduled for May.","Завершение второй очереди запланировано на май."],["There has been a significant increase in demand.","Наблюдается значительный рост спроса."],["Failure to pay on time will result in a penalty.","Неоплата в срок повлечёт штраф."],["We carried out a thorough inspection of the property.","Мы провели тщательный осмотр объекта."]],
 err:[["The grow of prices…","The growth of prices…","Существительное — growth."],["After the approve of the loan…","After the approval of the loan…","approve → approval."],["A sharply rise…","A sharp rise…","Перед существительным — прилагательное."]],
 q:[["c","There was a ___ in sales last quarter.",["sharp decline","sharply decline","sharp declined"],"Прилагательное + существительное."],
  ["c","The ___ of the project was delayed by six months.",["completion","complete","completing of"],"complete → completion."],
  ["c","___ to comply with the rules may lead to a fine.",["Failure","Fail","Failed"],"fail → failure."],
  ["g","We are waiting for the bank's ___ (approve).",["approval"],"approve → approval."],
  ["g","The board made a ___ (decide) to launch in spring.",["decision"],"make a decision."],
  ["b","There has been a significant increase in demand.","Наблюдается значительный рост спроса."],
  ["c","The two sides finally ___ an agreement.",["reached","did","made up"],"reach an agreement."],
  ["c","The ___ of the plot took three months.",["acquisition","acquire","acquiring of"],"acquire → acquisition."],
  ["b","The completion of the second phase is scheduled for May.","Завершение второй очереди запланировано на май."],
  ["t","Сделайте формальнее: «Prices grew rapidly.» Начните с There was…",["There was a rapid growth in prices.","There was rapid growth in prices.","There was a rapid increase in prices.","There was a rapid rise in prices."],"rapidly → rapid, grew → growth."]]},

{id:"g29",lvl:"C1",cat:"s",t:"Усиление и вынос вперёд",en:"Emphasis & fronting",
 sum:"Do / did, so и such в начале, вынос обстоятельства — способы расставить акценты без повышения голоса.",
 rule:["<b>do / does / did + V</b> в утверждении — «действительно, всё-таки»: We <b>did send</b> the invoice. I <b>do understand</b> your concern.",
  "<b>So / Such</b> в начале + инверсия: <b>So high was</b> the demand <b>that</b> prices doubled. <b>Such was</b> the interest that we extended the event.",
  "Вынос вперёд обстоятельства места с глаголом движения или положения: <b>On the top floor is</b> a rooftop pool. <b>Here comes</b> the client.",
  "Усилители при отрицании и вопросе: not at all, no… whatsoever, by no means; What on earth…?",
  "Собственные усилители: the very centre, the sheer scale, a complete success, utterly, highly."],
 scheme:[["Кто","We"],["do / did","did"],["Глагол","warn"],["Остальное","you about the fee."]],
 ex:[["I do apologise for the delay.","Я действительно приношу извинения за задержку."],["So popular was the project that it sold out in three days.","Проект был настолько популярен, что его раскупили за три дня."],["There is no risk whatsoever.","Нет абсолютно никакого риска."],["Next to the lobby is a co-working space.","Рядом с лобби находится коворкинг."]],
 err:[["We did sent it.","We did send it.","После did — инфинитив."],["So high the demand was that…","So high was the demand that…","После So + прилагательное — инверсия."],["There is no risk whatever so.","There is no risk whatsoever.","whatsoever — одно слово."]],
 q:[["c","We ___ you about the service charge. It's in the email.",["did inform","did informed","do informed"],"did + инфинитив для усиления."],
  ["c","So strong ___ that the developer raised prices twice.",["was the demand","the demand was","did the demand"],"So + прилагательное + was + подлежащее."],
  ["c","There is no doubt ___ about the quality.",["whatsoever","whatever so","at all not"],"Усилитель отрицания."],
  ["g","I ___ (do) appreciate your patience. (настоящее)",["do"],"do + V — «действительно»."],
  ["g","On the ground floor ___ (be) a restaurant and a gym.",["are","is"],"Вынос места: глагол перед подлежащим."],
  ["b","So popular was the project that it sold out quickly.","Проект был настолько популярен, что его быстро раскупили."],
  ["c","She ___ like the flat, but the price was too high.",["did","does liked","was"],"Усиление в прошедшем: did like."],
  ["c","It is in the ___ centre of the city.",["very","much","too"],"the very centre — самый центр."],
  ["b","I do apologise for the delay.","Я действительно приношу извинения за задержку."],
  ["t","Усильте: «We sent the documents on Monday.» Используйте did.",["We did send the documents on Monday."],"did + send."]]},

{id:"g30",lvl:"C1",cat:"c",t:"Связки уровня C1",en:"Advanced discourse markers",
 sum:"Точные связки показывают логику: уступку, уточнение, оговорку, вывод.",
 rule:["<b>Добавление</b>: moreover, furthermore, what is more, in addition, not to mention. <b>Противопоставление</b>: whereas, while, by contrast, conversely, on the other hand.",
  "<b>Уступка</b>: nevertheless, nonetheless, even so, albeit (+ прилагательное / фраза), having said that, admittedly. The yield is attractive, <b>albeit</b> risky.",
  "<b>Уточнение</b>: namely, that is to say, in other words, to put it another way. <b>Оговорка</b>: as far as… is concerned, in terms of, with regard to, to some extent.",
  "<b>Вывод и следствие</b>: hence, thus, thereby (+ -ing), consequently, as a result, in light of this. They cut prices, <b>thereby attracting</b> new buyers.",
  "<b>Обобщение</b>: on the whole, by and large, all things considered, broadly speaking."],
 scheme:[["Мысль 1","Demand is strong."],["Связка","Having said that,"],["Мысль 2","supply is growing fast."]],
 ex:[["Dubai offers high liquidity, whereas Phuket offers higher yields.","Дубай даёт высокую ликвидность, тогда как Пхукет — более высокую доходность."],["The project was completed on time, albeit over budget.","Проект сдали вовремя, хотя и с превышением бюджета."],["As far as taxes are concerned, the UAE is very attractive.","Что касается налогов, ОАЭ очень привлекательны."],["All things considered, it is a sound investment.","С учётом всего это надёжная инвестиция."]],
 err:[["Despite of the risks…","Despite the risks… / In spite of the risks…","despite — без of."],["Albeit it is expensive…","Although it is expensive… / …, albeit expensive","albeit не вводит полное предложение."],["In the other hand…","On the other hand…","on the other hand."]],
 q:[["c","Flats in the centre are expensive, ___ those in the suburbs are affordable.",["whereas","nevertheless","hence"],"Сопоставление двух фактов."],
  ["c","The return is high, ___ not guaranteed.",["albeit","although it","despite"],"albeit + фраза без подлежащего."],
  ["c","They reduced the down payment, ___ making the project more accessible.",["thereby","therefore to","nonetheless"],"thereby + -ing — «тем самым»."],
  ["c","___ location is concerned, this project has no rivals.",["As far as","In terms","Regarding to"],"As far as… is concerned."],
  ["g","The market is slowing. ___ said that, prime locations remain in demand.",["Having"],"Having said that — «при этом»."],
  ["b","All things considered it is a sound investment.","С учётом всего это надёжная инвестиция."],
  ["c","The area lacks schools. ___, transport links are poor.",["Furthermore","Whereas","Albeit"],"Добавление аргумента."],
  ["c","Costs rose by 20%; ___ the higher prices.",["hence","albeit","whereas"],"hence — «отсюда»."],
  ["b","The project was completed on time albeit over budget.","Проект сдали вовремя, хотя и с превышением бюджета."],
  ["c","___ speaking, investors prefer completed projects.",["Broadly","Wide","In broad"],"Broadly speaking — «в целом»."]]},

{id:"g31",lvl:"C1",cat:"s",t:"Эллипсис и замещение",en:"Ellipsis & substitution",
 sum:"Носители не повторяют уже сказанное: они опускают слова или заменяют их на so, do, one.",
 rule:["<b>So / Neither + вспомогательный + подлежащее</b>: I've seen the flat. — <b>So have I</b>. I don't like it. — <b>Neither do I</b>.",
  "<b>so / not</b> после think, hope, expect, be afraid, suppose: Will prices fall? — I <b>hope not</b>. / I <b>think so</b>.",
  "<b>one / ones</b> вместо существительного: Which flat? — The <b>one</b> on the top floor. <b>do so</b> вместо глагольной группы: If you haven't signed yet, please <b>do so</b> today.",
  "Опускают повтор после вспомогательного и to: I can't come today, but I <b>can</b> tomorrow. You can pay in cash if you <b>want to</b>.",
  "В сочинённых частях опускают общее подлежащее и вспомогательный: She <b>has checked</b> the documents and <b>(has) sent</b> them to the bank."],
 scheme:[["Реплика","I have signed."],["So / Neither","So"],["Вспомогат.","have"],["Кто","I."]],
 ex:[["We haven't received the invoice. — Neither have we.","Мы не получили счёт. — Мы тоже."],["Is the lift working? — I'm afraid not.","Лифт работает? — Боюсь, что нет."],["I prefer the larger flat to the smaller one.","Я предпочитаю большую квартиру маленькой."],["You don't have to attend, but you can if you'd like to.","Вам не обязательно присутствовать, но можете, если хотите."]],
 err:[["I like it. — So I do.","I like it. — So do I.","So + вспомогательный + подлежащее."],["I don't know. — Me too.","I don't know. — Neither do I. / Me neither.","После отрицания — neither."],["I hope no.","I hope not.","hope not."]],
 q:[["c","A: I've already seen this project. B: ___",["So have I.","So I have seen.","So did I have."],"So + have + I."],
  ["c","A: We can't afford it. B: ___",["Neither can we.","So can't we.","Neither we can."],"После отрицания — Neither + can + we."],
  ["c","A: Will the price go up? B: I ___.",["hope not","hope no","don't hope so it"],"hope not."],
  ["g","Which villa do you mean? — The ___ with the pool.",["one"],"one вместо существительного."],
  ["g","If you have not registered yet, please do ___ today.",["so"],"do so."],
  ["b","You can pay in cash if you want to.","Вы можете заплатить наличными, если хотите."],
  ["c","She didn't attend the viewing, but her husband ___.",["did","was","attended it did"],"Вспомогательный вместо повтора."],
  ["c","A: Is the flat still available? B: I think ___.",["so","it","yes it"],"I think so."],
  ["b","I prefer the larger flat to the smaller one.","Я предпочитаю большую квартиру маленькой."],
  ["c","A: I don't trust that developer. B: ___",["Neither do I.","So do I.","Neither I do."],"Neither + do + I."]]}
];

/* =========================================================
   GRAMMAR · A2 (foundation for the A2 → C2 path). Same topic shape as grammar1.js.

  "Подсказки: usually, every day, often → Simple; now, at the moment, this week → Continuous. Глаголы состояния (know, like, want, need, believe) в Continuous обычно не ставят: I <b>know</b>, а не I am knowing."],
 scheme:[["Обычно","I work / she works"],["Сейчас","I am working / she is working"],["Вопрос обычно","Do you work…? Does she work…?"],["Вопрос сейчас","Are you working…? Is she working…?"]],

 err:[["The elderly is entitled to discounts.","The elderly are entitled to discounts.","The + прилагательное — множественное число."],["He has good knowledge of the market.","He has a good knowledge of the market.","Вид знания с уточнением — a … knowledge of."],["She is in the hospital since Monday (BrE).","She has been in hospital since Monday.","В британском: in hospital — как пациент."]],

{id:"x04",lvl:"C2",cat:"v",t:"Сложные модели: suggest that he go, insist on his doing",en:"Complex verb patterns",

{id:"x05",lvl:"C2",cat:"c",t:"Регистр: от разговорного к официальному",en:"Register shifting",
 sum:"Носитель на уровне C2 переключает стиль: одну мысль скажет другу, начальнику и в официальном письме — по-разному.",
 rule:["Фразовые глаголы и простые слова в официальном стиле заменяют латинскими: find out → <b>ascertain</b>, put off → <b>postpone</b>, look into → <b>investigate</b>, set up → <b>establish</b>, get → <b>obtain / receive</b>, need → <b>require</b>, ask for → <b>request</b>.",
  "Официальный стиль: без сокращений, безличные обороты и пассив: <b>It is recommended that</b>…, <b>Payment is required</b> within 14 days. <b>One</b> might argue… Вместо «We'd love it if you could…» — <b>We would be grateful if you could…</b>",
  "Обратное тоже навык: в чате и устной речи официальность звучит холодно. «Kindly be informed that…» в переписке с коллегой — перебор; лучше <b>Just a heads-up:</b> или <b>FYI</b>."],
 scheme:[["Разговорный","We need to find out why…"],["Нейтральный","We need to understand why…"],["Официальный","It is necessary to ascertain why…"]],
 ex:[["We would be grateful if you could confirm receipt.","Будем признательны, если вы подтвердите получение."],["The meeting has been postponed until further notice.","Встреча отложена до дальнейшего уведомления."],["Applicants are required to submit proof of income.","Заявители обязаны предоставить подтверждение дохода."],["Just a heads-up: the client's running late.","Предупреждаю: клиент опаздывает."]],
 err:[["We will look into this matter and get back to you (официальное письмо регулятору).","We will investigate this matter and respond in due course.","В официальном тексте — латинская лексика."],["Kindly be informed that the coffee machine is broken (коллегам в чат).","FYI, the coffee machine's broken.","В чате с коллегами официальность звучит странно."],["It's required that you'll pay by Friday.","Payment is required by Friday.","Официальный стиль — пассив, без сокращений."]],
 q:[["c","Formal equivalent of 'put off the meeting':",["postpone the meeting","delay off the meeting","set back the meeting"],"Put off → postpone."],
  ["c","Formal equivalent of 'find out the cause':",["ascertain the cause","get out the cause","look up the cause"],"Find out → ascertain."],
  ["c","Which sentence suits a formal complaint letter?",["I am writing to express my dissatisfaction with the service.","I'm writing cos I'm not happy with the service.","Just wanted to say the service was meh."],"Официальный стиль: полные формы, нейтральная лексика."],
  ["c","Which is most natural in a quick Slack message to a colleague?",["Can you send me the slides when you get a sec?","I should be grateful if you would kindly forward the slides.","It is requested that the slides be forwarded."],"Неформальный канал — неформальный стиль."],
  ["g","Formal: 'We need your passport.' → 'Your passport is ___.'",["required"],"Need → require, пассив."],
  ["g","Formal: 'They set up the company in 2010.' → 'The company was ___ in 2010.'",["established","founded"],"Set up → establish."],
  ["g","Formal: 'Ask for a refund.' → '___ a refund.'",["Request"],"Ask for → request."],
  ["b","We would be grateful if you could reply by Monday.","Будем признательны за ответ до понедельника."],
  ["b","Further information can be obtained from our office.","Дополнительную информацию можно получить в нашем офисе."],
  ["t","Перепишите официально: «We'll look into your complaint and get back to you soon».",["We will investigate your complaint and respond shortly.","We will investigate your complaint and reply shortly.","Your complaint will be investigated and we will respond shortly.","We will investigate your complaint and respond in due course."],"Look into → investigate, get back → respond/reply, без сокращений."]]},

{id:"x06",lvl:"C2",cat:"m",t:"Дистанция и такт: I was wondering, I'd have thought",en:"Distancing for politeness & tact",
 sum:"Прошедшее время и would в английском часто означают не прошлое, а вежливую дистанцию. Так звучат просьбы и несогласие у носителей.",
 rule:["Прошедшее и длительное время смягчают просьбу: <b>I was wondering if</b> you could… / <b>I was hoping</b> we could… / <b>We were thinking</b> of… — речь о настоящем, но звучит мягче, чем I want.",
  "Would смягчает мнение и несогласие: <b>I'd have thought</b> the price was negotiable. <b>I would suggest</b>… <b>Would it be possible to</b>…? <b>It might be worth</b> checking…",
  "Смягчители: <b>just, quite, a little, slightly, a bit</b>: I <b>just</b> wanted to check… That's <b>not quite</b> what we agreed. I'm <b>a little</b> concerned about… А <b>I'm afraid</b> — вежливая подача плохой новости, а не страх."],
 scheme:[["Прямо","I want a discount."],["Мягче","I was wondering if a discount might be possible."],["Несогласие","I'd have thought the price included parking."]],
 ex:[["I was wondering if you could send the documents today.","Не могли бы вы отправить документы сегодня?"],["I'd have thought the developer would cover that.","Я бы предположил, что это покроет застройщик."],["I'm afraid that's not quite what we agreed.","Боюсь, мы договаривались немного о другом."],["It might be worth getting a second opinion.","Возможно, стоит узнать ещё одно мнение."]],
 err:[["I want that you send me the contract.","I was wondering if you could send me the contract.","Прямое I want звучит резко; и want that — грамматическая ошибка."],["You are wrong about the price.","I'd have thought the price was a little higher.","Несогласие подают через would и смягчители."],["I was wondering if you can help.","I was wondering if you could help.","После I was wondering — could."]],
 q:[["c","Most tactful way to ask:",["I was wondering if we could move the meeting.","Move the meeting.","I want to move the meeting."],"I was wondering if — мягкая просьба."],
  ["c","I ___ the price included the furniture.",["'d have thought","have thought","would think have"],"I'd have thought — мягкое несогласие."],
  ["c","I'm ___ that's not quite right.",["afraid","fear","scary"],"I'm afraid — вежливая подача."],
  ["c","It ___ worth asking for a discount.",["might be","might to be","may being"],"It might be worth + -ing."],
  ["g","I just ___ (want) to check the dates. (смягчение через прошедшее)",["wanted"],"I just wanted to — мягче, чем I want."],
  ["g","We ___ (think) of offering a little less. (длительное, мягко)",["were thinking"],"We were thinking of — мягкое предложение."],

  ["b","I was hoping we could agree on the price today.","Я надеялся, что мы сегодня договоримся о цене."],

const SRC=window.SpeechRecognition||window.webkitSpeechRecognition||null;

const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numWords(n){
  n=parseInt(n,10); if(isNaN(n)) return "";
  if(n<20) return ONES[n];
  if(n<100) return TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"");
  if(n<1000) return ONES[Math.floor(n/100)]+" hundred"+(n%100?" "+numWords(n%100):"");
  if(n<1000000) return numWords(Math.floor(n/1000))+" thousand"+(n%1000?" "+numWords(n%1000):"");
  return numWords(Math.floor(n/1000000))+" million"+(n%1000000?" "+numWords(n%1000000):"");
}
const CONTR={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","it's":"it is","that's":"that is","there's":"there is","what's":"what is","let's":"let us",
  "don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","haven't":"have not",
  "i'll":"i will","we'll":"we will","you'll":"you will","i'd":"i would","we'd":"we would","i've":"i have","we've":"we have","okay":"ok"};
const SKIPW=new Set(["a","an","the"]);
const BRIT={roubles:"rubles",rouble:"ruble",metres:"meters",metre:"meter",centre:"center",centres:"centers",programme:"program",organise:"organize",prioritise:"prioritize",favourite:"favorite",cheque:"check",licence:"license",enrolment:"enrollment",storey:"story",storeys:"stories",instalment:"installment",instalments:"installments",neighbourhood:"neighborhood",colour:"color",analyse:"analyze"};
function spWords(s){
  s=String(s).toLowerCase().replace(/[’`]/g,"'")
    .replace(/(\d),(\d{3})/g,"$1$2").replace(/(\d+)\.(\d+)/g,(m,a,b)=>a+" point "+b.split("").join(" "))
    .replace(/(\d+)\s*%/g,"$1 percent").replace(/per cent/g,"percent").replace(/\$\s*(\d+)/g,"$1 dollars").replace(/(\d+)(st|nd|rd|th)\b/g,"$1")
    .replace(/[.,!?;:«»"()—–\-\/]/g," ");
  const out=[];
  s.split(/\s+/).filter(Boolean).forEach(w=>{
    if(/^\d+$/.test(w)) out.push(...numWords(w).split(" "));
    else if(CONTR[w]) out.push(...CONTR[w].split(" "));
    else { const x=w.replace(/'s$/,"").replace(/'/g,""); out.push(BRIT[x]||x); }
  });
  return out.filter(w=>w&&!SKIPW.has(w));
}
/* LCS between target and heard words; returns matched count and which target words were heard */
function spScore(target,heard){
  const t=spWords(target), h=spWords(heard), m=t.length, n=h.length;
  const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) d[i][j]=t[i]===h[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const hit=new Array(m).fill(false); let i=0,j=0;
  while(i<m&&j<n){ if(t[i]===h[j]){ hit[i]=true; i++; j++; } else if(d[i+1][j]>=d[i][j+1]) i++; else j++; }
  const matched=d[0][0]||0;
  const need=m-Math.floor(Math.max(0,m-1)/5);
  return {matched,total:m,hit,ok:m>0&&matched>=need,extra:Math.max(0,n-matched)};
}
/* marks the target sentence word by word: heard words green, missed words red */
function spDiffHTML(target,hit){
  let k=0;
  return target.split(/\s+/).map(tok=>{
    const ws=spWords(tok); if(!ws.length) return esc(tok);
    const good=ws.every(()=>hit[k++]);
    return `<span class="${good?"wg":"wb"}">${esc(tok)}</span>`;
  }).join(" ");
}

function exRu(u,i){ const w=u.words[i]; const d=shuffle(u.words.filter((_,j)=>j!==i).map(x=>x[0])).slice(0,3); return {type:"ru",u,w,i,ref:wref(u,i),opts:shuffle([w[0],...d]),ans:w[0],sel:null,say:clean(w[0])}; }

  PATTERNS.filter(p=>p.u.some(id=>units.some(u=>u.id===id))).forEach(p=>{
    const seen=new Set();
    for(let k=0;k<4;k++){ const f=fillPattern(p); if(!seen.has(f.en)){ seen.add(f.en); out.push({...f,u:byId[p.u.find(id=>units.some(u=>u.id===id))]}); } }

/* picks the next phrase whose length fits the learner's current pace; words being learned come first */
function pickSpeak(){

  const want=L.spTargets||[];
  let best=0,bestScore=Infinity;
  pool.forEach((c,idx)=>{ const n=spLen(c.en); let s=Math.abs(n-mid)+(n<lo||n>hi?3:0); if(want.some(t=>c.en.toLowerCase().includes(t))) s-=2.5; s+=Math.random(); if(s<bestScore){ bestScore=s; best=idx; } });
  return exSpeak(pool.splice(best,1)[0],"tr");
}
function speakLesson(units,newIdx,reviewRefs,count){

    L_targets.push(gapOf(u.words[i]).toLowerCase().split(" ")[0]);

  reviewRefs.forEach(r=>{ const [uid,rest]=r.split(":"); const u=byId[uid]; if(!u||rest[0]==="s") return; const w=u.words[+rest]; if(w){ items.push(exSpeak({en:w[3],ru:"",ref:r,u},"sh")); L_targets.push(gapOf(w).toLowerCase().split(" ")[0]); } });

function speakEval(ex,alts){

  let best=null;

  ex.heard=best.text; ex.hit=best.hit;
  ex.secs=Math.max(1,(Date.now()-(ex.tShow||Date.now()))/1000);
  const ok=best.ok;
  settle(ex,{ok,score:best.matched/Math.max(1,best.total)},ex.hint>=2?"hard":undefined);
  spStats(ex,ok,best);
  if(!ok&&S.voice) say(ex.en);

function spStats(ex,ok,best){

  else { sp.up=0; }
}
