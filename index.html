const cur=()=>L.items[L.i];
function ready(ex){
  if(XT[ex.type]) return XT[ex.type].ready(ex);
  switch(ex.type){
    case "mcq":case "ru":case "listen":case "pic":case "gap":case "rq": return ex.sel!==null;
    case "type": return ex.text.trim().length>0;
    case "own": return ex.text.trim().split(/\s+/).length>=3;
    case "speak": return spMode()==="type"&&ex.text.trim().length>0;
    case "flash": return ex.shown;
    case "build":case "lbuild": return ex.ans.length>0;
    case "chat": return ex.mode==="build"?ex.ans.length>0:ex.sel!==null;
    case "order": return ex.placed.length===ex.pool.length;
    default: return true;
  }
}
function evaluate(ex){
  if(XT[ex.type]) return XT[ex.type].ev(ex);
  const tileStr=()=>ex.ans.map(id=>ex.tiles[id].w).join(" ");
  switch(ex.type){
    case "mcq":case "ru":case "listen":case "pic":case "gap":case "rq": return {ok:ex.opts[ex.sel]===ex.ans};
    case "type":{
      const t=norm(ex.text).replace(/^(to|a|an|the) /,"");
      const vars=clean(ex.w[0]).split(" / ").map(v=>norm(v).replace(/^to /,""));
      if(vars.includes(t)) return {ok:true};
      if(vars.some(v=>v.length>4&&lev(v,t)===1)) return {ok:true,note:"Почти идеально, проверьте написание: "+clean(ex.w[0])};
      return {ok:false};
    }
    case "build":case "lbuild": return {ok:norm(tileStr())===norm(ex.en)};
    case "chat": return ex.mode==="build" ? {ok:norm(tileStr())===norm(ex.rd.b[0])} : {ok:ex.opts[ex.sel].ok};
    case "order": return {ok:ex.placed.every((v,k)=>v===k)};

}
function markWrong(ex){

  if(!ex.retry){ const a=again(ex); if(a){ if(a.type==="speak") L.items.splice(Math.min(L.items.length,L.i+3),0,a); else L.items.push(a); } }
}
function settle(ex,r,q){

const PRAISE=["Отлично!","Супер!","Так держать!","Как настоящий брокер!","Чётко, как сдача в срок!","Блестяще!","Клиент доволен!"];
function answerText(ex){
  if(XT[ex.type]) return XT[ex.type].ans(ex);
  switch(ex.type){
    case "mcq":case "ru":case "listen":case "pic":case "type": return `${ex.w[0]} — ${ex.w[2]}`;
    case "gap": return ex.w[3];
    case "build":case "lbuild": return ex.en;
    case "chat": return ex.mode==="build"?ex.rd.b[0]:ex.rd.o[0][0];
    case "order": return ex.u.mail.lines.join(" / ");
    case "match": return ex.idx.map(i=>clean(ex.u.words[i][0])+" — "+ex.u.words[i][2]).join("; ");
    case "rq": return ex.ans;
    case "speak": return ex.en;
    case "own": return ex.res&&ex.res.corrected ? ex.res.corrected : ex.w[3];
    case "flash": return `${ex.w[0]} — ${ex.w[2]}`;
  }
  return "";
}
function answerSub(ex){
  if(ex.type==="build"||ex.type==="lbuild") return ex.ru;
  if(ex.type==="chat"&&ex.mode==="build") return ex.rd.b[1];
  if(ex.type==="gap") return ex.w[2];
  if(ex.type==="speak") return ex.ru;
  return "";
}

  const sub=answerSub(ex), showAns=["build","lbuild","chat","speak","gc","gg","gt"].includes(ex.type);
  const body = ok
    ? `<h3>${rnd(PRAISE)}</h3>${r.note?`<p>${esc(r.note)}</p>`:""}${showAns?`<p>${esc(answerText(ex))}${sub?`<small>${esc(sub)}</small>`:""}</p>`:""}${fb?`<p><small>${esc(fb)}</small></p>`:""}`
    : `<h3>Правильный ответ:</h3><p>${esc(answerText(ex))}${sub?`<small>${esc(sub)}</small>`:""}${fb?`<small>${esc(fb)}</small>`:""}</p>`;
  return `<div class="lfoot ${ok?"okb":"badb"}" role="status"><div class="wrap"><div class="fbm"><div class="m">${mascot(ok?"happy":"sad")}</div><div>${body}</div></div>
    <button class="b3 ${ok?"ok":"bad"}" data-act="next">${ok?"Дальше":"Понятно"}</button></div></div>`;

function passageHTML(u,ex,mark){

    let t=esc(u.read.text.replace(/\[\[|\]\]/g,""));

  }

}
function chatHTML(ex){
  const u=ex.u, ch=u.chat, rounds=ch.r;

  let h="";
  if(ex.hist) for(let k=0;k<ex.r;k++){ const rd=rounds[k]; h+=inMsg(rd.in)+outMsg(rd.b?rd.b[0]:rd.o[0][0]); }
  h+=inMsg(ex.rd.in);
  h+= L.state==="checked" ? outMsg(ex.mode==="build"?ex.rd.b[0]:ex.rd.o[0][0]) : `<span class="typing">Ваш ответ…</span>`;

async function authAction(a){
  try{
    if(a==="auth-tab-login"||a==="auth-tab-register"){ readAuthForm(); authTab=a.slice(9); authErr=""; render(); return; }
    if(a==="auth-submit"){
      readAuthForm(); if(authBusy) return;
      authBusy=true; authErr=""; render();
      const body={email:AUTHF.email.trim(),password:AUTHF.pass};
      if(authTab==="register"){ body.name=AUTHF.name.trim(); body.invite=AUTHF.invite.trim(); }
      try{ const j=await api("/auth/"+authTab,{method:"POST",body}); AUTHF.pass=""; authBusy=false; await afterLogin(j); }
      catch(e){ authBusy=false; authErr=authErrText(e); render(); }
      return;
    }
    if(a==="acct-name"){ const j=await api("/me",{method:"PATCH",body:{name:val("ac-name")}}); ME=j.user; acctMsg="Имя сохранено."; }
    else if(a==="acct-email"){ const j=await api("/auth/add-email",{method:"POST",body:{email:val("ac-email"),password:val("ac-pass")}}); ME=j.user; acctMsg="Готово: теперь можно входить на сайте по e-mail и паролю."; }
    else if(a==="acct-pass"){ await api("/auth/password",{method:"POST",body:{current:val("ac-cur"),password:val("ac-new")}}); acctMsg="Пароль изменён."; }
    else if(a==="acct-logout"){ logoutAsk=true; }
    else if(a==="acct-logout-no"){ logoutAsk=false; }
    else if(a==="acct-logout-yes"){
      if(pushTimer){ clearTimeout(pushTimer); pushTimer=null; await pushProgress(); }
      try{ await api("/auth/logout",{method:"POST"}); }catch(e){}
      setToken(""); ME=null; isAdmin=false; logoutAsk=false; resetLocal(); try{ localStorage.removeItem(KEY); }catch(e){}
      authTab="login"; render(); return;
    }
  }catch(e){ acctMsg=authErrText(e); }
  render();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-act]"); if(!t) return;
  const d=t.dataset;
  if(d.say!==undefined){ e.stopPropagation(); say(d.say); return; }
  if(d.sayslow!==undefined){ say(d.sayslow,.6); return; }
  if(t.classList.contains("veil") && e.target!==t) return;
  if(d.view){ S.view=d.view; modal=null; resetAsk=false; acctMsg=""; if(d.view==="team"){ TEAM=null; teamMsg=""; } render(); window.scrollTo(0,0); return; }
  if(d.reset){ resetPass(d.reset); return; }
  if(d.act==="team-refresh"){ TEAM=null; teamMsg=""; render(); return; }
  if(d.node){ modal={t:"node",key:d.node}; render(); return; }
  if(d.start){ const [u,k]=d.start.split(":"); startLesson(u,isNaN(+k)?k:+k); return; }
  if(d.spmode){ S.spMode=d.spmode; micStop(); if(L&&cur()&&cur().type==="speak") cur().listening=false; render(); return; }
  if(d.spauto){ S.spAuto=d.spauto==="1"; render(); return; }
  if(d.spgoal){ S.spGoal=+d.spgoal; render(); return; }
  if(d.spself&&S.view==="lesson"&&L&&L.state==="answer"){ spSelf(d.spself==="ok"); return; }
  if(d.hints){ modal={t:"hints",uid:d.hints}; render(); return; }
  if(d.du){ dictU=d.du; render(); return; }
  if(d.goal){ S.goal=+d.goal; render(); return; }
  if(d.snd){ S.snd=d.snd==="1"; render(); return; }
  if(d.voice){ S.voice=d.voice==="1"; render(); return; }
  if(d.gl!==undefined&&S.view==="lesson"&&L){ const ex=cur(); ex.open[+d.gl]=!ex.open[+d.gl]; render(); return; }
  if(d.rate&&S.view==="lesson"&&L){ rateFlash(d.rate); return; }
  if(d.sc){ startScenario(d.sc); return; }
  if(d.hintfill!==undefined&&TU&&TU.hint){ TU.draft=TU.hint[+d.hintfill].en||""; TU.hint=null; render(); const i=document.getElementById("aiin"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } return; }
  if(S.view==="lesson"&&L&&L.state==="answer"){
    const ex=cur();
    if(d.opt!==undefined){ ex.sel=+d.opt; if(ex.type==="pic") say(clean(ex.opts[ex.sel])); render(); return; }
    if(d.tile!==undefined){ ex.ans.push(+d.tile); say(ex.tiles[+d.tile].w); render(); return; }
    if(d.untile!==undefined){ ex.ans=ex.ans.filter(x=>x!==+d.untile); render(); return; }
    if(d.place!==undefined){ ex.placed.push(+d.place); render(); return; }
    if(d.unplace!==undefined){ ex.placed.splice(+d.unplace,1); render(); return; }
    if(d.ml!==undefined){ matchTap(ex,"L",+d.ml); return; }
    if(d.mr!==undefined){ matchTap(ex,"R",+d.mr); return; }
  }
  const a=d.act;
  if(a==="close"){ modal=null; render(); }
  else if(a==="review") startLesson(UNITS[0].id,"r");
  else if(a==="check") check();
  else if(a==="next") next();
  else if(a==="skip") skip();
  else if(a==="quit"){ L.quit=true; render(); }
  else if(a==="quitno"){ L.quit=false; render(); }
  else if(a==="quityes"){ try{speechSynthesis.cancel();}catch(err){} const b=L&&L.back||"home"; L=null; S.view=b; render(); }
  else if(a==="home"){ const b=L&&L.back||"home"; L=null; S.view=b; render(); window.scrollTo(0,0); if(b==="path"){ const nn=nextNode(); const el=nn&&document.getElementById(nn.split(":")[0]); if(el) el.scrollIntoView({block:"start"}); } }
  else if(a==="chattr"){ chatTr=!chatTr; render(); }
  else if(a&&a.startsWith("auth-")||a&&a.startsWith("acct-")) authAction(a);
  else if(a==="install"){ const pr=window.__pwaPrompt; if(pr){ pr.prompt(); pr.userChoice.finally(()=>{ window.__pwaPrompt=null; render(); }); } }
  else if(a==="mic"){ const ex=cur(); if(ex.listening){ if(REC) try{ REC.stop(); }catch(err){} } else micStart(ex); }
  else if(a==="sphint"){ const ex=cur(); ex.hint=Math.min(2,ex.hint+1); render(); if(ex.hint===2&&S.voice) say(ex.en); }
  else if(a==="spreveal"){ const ex=cur(); ex.shown=true; render(); if(S.voice) say(ex.en); }
  else if(a==="assoc-ai") assocAI(cur());
  else if(a==="reveal"){ const ex=cur(); ex.shown=true; render(); if(S.voice) say(ex.say); }
  else if(a==="aisend") aiSend();
  else if(a==="aihint") aiHint();
  else if(a==="aiend") aiSummary();
  else if(a==="aistop"){ if(TU&&TU.ctl) TU.ctl.abort(); }
  else if(a==="aiback"){ if(TU&&TU.ctl) TU.ctl.abort(); TU=null; render(); }
  else if(a==="reset"){ resetAsk=true; render(); }
  else if(a==="resetno"){ resetAsk=false; render(); }
  else if(a==="resetyes"){ Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,JSON.parse(JSON.stringify(DEF)),{view:"profile"}); resetAsk=false; render(); }
});
function matchTap(ex,side,i){
  if(ex.done[i]) return;
  if(side==="L"){ ex.selL=i; say(clean(ex.u.words[i][0])); } else ex.selR=i;
  ex.flash=null;
  if(ex.selL!==null&&ex.selR!==null){
    if(ex.selL===ex.selR){ ex.done[ex.selL]=1; beep("ok"); }
    else { ex.err++; ex.flash=[ex.selL,ex.selR]; beep("bad"); setTimeout(()=>{ if(ex.flash){ ex.flash=null; if(S.view==="lesson"&&L&&cur()===ex) render(); } },500); }
    ex.selL=null; ex.selR=null;
  }
  if(Object.keys(ex.done).length===ex.idx.length){
    const ok=ex.err<=1; ex.res={ok}; L.state="checked";
    if(!ex.retry){ L.first++; if(ok) L.okFirst++; }
    if(ok){ L.combo++; L.maxCombo=Math.max(L.maxCombo,L.combo); ex.idx.forEach(i=>grade(wref(ex.u,i),true)); } else { L.combo=0; L.mist++; }
  }
  render();
}

  if(e.target.id==="aiin"&&e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); aiSend(); return; }
  if(S.view!=="lesson"||!L||L.quit) return;
  const ex=cur();
  if(ex.type==="speak"&&L.state==="answer"&&spMode()==="mic"&&e.key===" "&&!/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)){ e.preventDefault(); if(ex.listening){ if(REC) try{ REC.stop(); }catch(err){} } else micStart(ex); return; }
  if(ex.type==="flash"&&L.state==="answer"&&!/INPUT|TEXTAREA/.test(e.target.tagName)){
    if(!ex.shown&&(e.key===" "||e.key==="Enter")){ e.preventDefault(); ex.shown=true; render(); return; }
    if(ex.shown){ const m={"1":"again","2":"hard","3":"good","4":"easy"}[e.key]; if(m){ rateFlash(m); return; } }
  }
  if(e.key==="Enter"){
    if(e.target.id==="typein"&&!e.shiftKey){ e.preventDefault(); if(L.state==="answer") check(); else next(); return; }
    if(e.target.closest&&e.target.closest("button")) return;
    e.preventDefault(); if(L.state==="answer") check(); else next(); return;
  }
  if(e.target.tagName==="TEXTAREA") return;
  const n=parseInt(e.key,10);
  if(L.state==="answer"&&n>=1&&ex.opts&&n<=ex.opts.length){ ex.sel=n-1; render(); }
  if(L.state==="answer"&&e.key==="Backspace"&&ex.ans&&ex.ans.length){ e.preventDefault(); ex.ans.pop(); render(); }
});

/* confetti */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.getElementById("confetti"); if(!cv||!cv.getContext) return;
  cv.hidden=false; const ctx=cv.getContext("2d"); const dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#2E4FD6","#F5B800","#3FA36B","#E2574C","#7F97FF"];
  const ps=[...Array(110)].map(()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,s:Math.random()*7+4,r:Math.random()*6,c:rnd(cols)}));
  let f=0; (function tick(){ ctx.clearRect(0,0,innerWidth,innerHeight); ps.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.r+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}); if(++f<120) requestAnimationFrame(tick); else { ctx.clearRect(0,0,innerWidth,innerHeight); cv.hidden=true; } })();
}

/* =========================================================
   LIVE ENGLISH view: browse, filter, listen, add to "My words", quick quiz
   ========================================================= */
let liveC="all", liveG="all", liveQ="", LQ=null;
const liveHas=e=>S.my.some(m=>m.w.toLowerCase()===e.toLowerCase());
function liveRows(){
  const q=liveQ.trim().toLowerCase();
  return LIVE.map((r,i)=>({r,i})).filter(({r})=>(liveC==="all"||r[5]===liveC)&&(liveG==="all"||r[4]===liveG)&&(!q||r[0].toLowerCase().includes(q)||r[1].toLowerCase().includes(q)||r[2].toLowerCase().includes(q)));
}
function liveCard({r,i}){
  const [e,ru,m,x,g,,l,t,o]=r, has=liveHas(e);
  return `<div class="lw"><div class="lwh"><b>${esc(e)}</b>${sayBtn(e)}<span class="oxl lv${l}">${LV[l]}</span></div>
    <span class="lru">${esc(ru)}</span>
    <div class="lmeta"><span class="tag">${esc(LIVE_REG[g])}</span><span class="tone t${t}">${LIVE_TONE[t]}</span></div>
    <p class="lm">${esc(m)}</p>
    <div class="lx">${sayBtn(x,"Пример")}<i>${esc(x)}</i></div>
    ${o?`<small class="lo">Откуда: ${esc(o)}</small>`:""}
    <button class="mini ${has?"":"t"}" data-x="ladd:${i}" ${has?"disabled":""}>${has?"✓ В моём словаре":"+ Учить"}</button></div>`;
}
function drawLive(){
  const el=document.getElementById("livelist"); if(!el) return;
  const rows=liveRows();
  el.innerHTML=rows.length?`<p class="hint">Найдено: ${rows.length}</p>`+rows.map(liveCard).join(""):`<p class="hint">Ничего не нашлось. Попробуйте другое слово или снимите фильтры.</p>`;
}
function liveQuizStart(){
  const pool=liveRows().map(x=>x.i), base=pool.length>=4?pool:LIVE.map((_,i)=>i);
  const qs=shuffle(base.slice()).slice(0,8).map(i=>{
    const same=LIVE.map((_,k)=>k).filter(k=>k!==i&&LIVE[k][5]===LIVE[i][5]&&LIVE[k][1]!==LIVE[i][1]);
    return {i,opts:shuffle([i].concat(shuffle(same).slice(0,3)))};
  });
  LQ={qs,k:0,sel:null,ok:0,wrong:[]}; render(); window.scrollTo(0,0);
  if(S.voice) say(LIVE[qs[0].i][0]);
}
function liveQuizHTML(){
  if(!LQ) return "";
  if(LQ.k>=LQ.qs.length){
    const w=LQ.wrong.filter(i=>!liveHas(LIVE[i][0]));
    return `<div class="card lquiz"><h2>Результат: ${LQ.ok} из ${LQ.qs.length}</h2>
      <p>${LQ.ok===LQ.qs.length?"Отлично: вы понимаете живую речь.":"Ошибки — это фразы, которые стоит выучить."}</p>
      <div class="row">${w.length?`<button class="b3" data-x="laddw">+ Учить ошибки · ${w.length}</button>`:""}<button class="b3 ghost" data-x="lquiz">Ещё раз</button><button class="b3 ghost" data-x="lqclose">Закрыть</button></div></div>`;
  }
  const q=LQ.qs[LQ.k], r=LIVE[q.i], done=LQ.sel!==null;
  return `<div class="card lquiz"><div class="plan-h"><span class="tag">Проверь себя · ${LQ.k+1} из ${LQ.qs.length}</span><button class="link" data-x="lqclose">Закрыть</button></div>
    <div class="prompt"><span class="big">${esc(r[0])}</span>${sayBtn(r[0])}</div><p class="hint">Что это значит?</p>
    <div class="lqopts">${q.opts.map(k=>`<button class="opt ${done?(k===q.i?"right":k===LQ.sel?"wrong":""):""}" data-x="lqa:${k}" ${done?"disabled":""}><span>${esc(LIVE[k][1])}</span></button>`).join("")}</div>
    ${done?`<p class="lm">${esc(r[2])}</p><div class="lx">${sayBtn(r[3],"Пример")}<i>${esc(r[3])}</i></div><button class="b3 wide" data-x="lqn">${LQ.k+1<LQ.qs.length?"Дальше":"Итог"}</button>`:""}</div>`;
}
function viewLive(){
  const cats=[["all","Все"]].concat(Object.entries(LIVE_CAT)), regs=[["all","Все страны"]].concat(Object.entries(LIVE_REG));
  const mine=LIVE.filter(r=>liveHas(r[0])).length;
  return `<div class="pg"><div class="pg-h"><div><h1>Живой английский</h1><p class="hint">${LIVE.length} фраз, как говорят сейчас в США, Великобритании, Австралии, Канаде, Ирландии и Новой Зеландии: разговорные выражения, офисный язык, сленг, мемы и сокращения в переписке. У каждой фразы — где так говорят и насколько это неформально.</p></div>
      <div class="row acts"><button class="b3" data-x="lquiz">${ico("bolt")}Проверь себя</button><button class="b3 ghost" data-start="ox:ox">${ico("book")}Учить из словаря · ${mine}</button></div></div>
    ${liveQuizHTML()}
    <p class="lnote">Сленг меняется быстро: подборка актуальна на 2025–2026 годы. Метка <b>«осторожно»</b> — фраза может обидеть или имеет второй смысл; на работе её лучше не использовать.</p>
    <div class="filters">${cats.map(([k,l])=>`<button class="fchip" data-x="lc:${k}" aria-pressed="${liveC===k}">${esc(l)}</button>`).join("")}</div>
    <div class="filters">${regs.map(([k,l])=>`<button class="fchip" data-x="lg:${k}" aria-pressed="${liveG===k}">${esc(l)}</button>`).join("")}</div>
    <div class="filters"><input id="liveq" class="search" type="search" placeholder="Поиск: no cap, обиженный, mate…" value="${esc(liveQ)}" aria-label="Поиск по фразам"></div>
    <div class="oxlist" id="livelist"></div></div>`;
}
function liveDayCard(){
  const d=new Date(), r=LIVE[(d.getDate()*53+d.getMonth()*97+d.getFullYear())%LIVE.length];
  return `<div class="card wod-card"><h3>Фраза дня · ${esc(LIVE_CAT[r[5]].toLowerCase())}</h3><div class="wod"><div><b>${esc(r[0])}</b> ${sayBtn(r[0])}<p>${esc(r[1])}</p><span class="hint">${esc(r[3])}</span></div></div><button class="link" data-view="live">Весь живой английский →</button></div>`;
}
function liveAdd(i){ const r=LIVE[i]; if(liveHas(r[0])) return false; S.my.push({w:r[0],ru:r[1],ex:r[3],lv:r[6]}); return true; }
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-x]"); if(!t||t.disabled) return;
  const p=t.dataset.x.split(":"), a=p[0], b=p[1];
  if(a==="lc"){ liveC=b; render(); }
  else if(a==="lg"){ liveG=b; render(); }
  else if(a==="ladd"){ if(liveAdd(+b)){ save(); const y=window.scrollY; toast("Фраза в «Моём словаре»: она придёт в уроке новых слов."); window.scrollTo(0,y); } }
  else if(a==="lquiz") liveQuizStart();
  else if(a==="lqclose"){ LQ=null; render(); }
  else if(a==="lqa"){ if(!LQ||LQ.sel!==null) return; const q=LQ.qs[LQ.k]; LQ.sel=+b; if(+b===q.i) LQ.ok++; else LQ.wrong.push(q.i); render(); if(S.voice) say(LIVE[q.i][3]); }
  else if(a==="lqn"){ if(!LQ) return; LQ.k++; LQ.sel=null; render(); const q=LQ.qs[LQ.k]; if(q&&S.voice) say(LIVE[q.i][0]); }
  else if(a==="laddw"){ if(!LQ) return; let n=0; LQ.wrong.forEach(i=>{ if(liveAdd(i)) n++; }); save(); toast(`${n} ${plural(n,"фраза","фразы","фраз")} в «Моём словаре».`); }
});
document.addEventListener("input",e=>{ if(e.target.id==="liveq"){ liveQ=e.target.value; drawLive(); } });

/* =========================================================
   READING view: exam-style texts B2–C1 with glossary, sentence breakdown and questions
   ========================================================= */
let RD=null; /* {id, opts:{qi:[order]}, sel:{qi:optionIndex}} */
const rdById=Object.fromEntries(READ.map(r=>[r.id,r]));
function rdState(){ if(!S.rd||typeof S.rd!=="object"||Array.isArray(S.rd)) S.rd={}; return S.rd; }
function rdOpen(id){ const r=rdById[id]; if(!r) return; const opts={}; r.q.forEach((q,i)=>opts[i]=shuffle(q[1].map((_,k)=>k))); RD={id,opts,sel:{}}; S.view="read"; render(); window.scrollTo(0,0); }
function rdKnown(w){ const o=oxById[w.toLowerCase()]; return o?oxSt(o)>=1||S.oxk[o.id]===2:S.my.some(m=>m.w.toLowerCase()===w.toLowerCase()); }
function rdAdd(w,ru,lv){ const o=oxById[w.toLowerCase()]; if(o){ if(!S.srs["o:"+o.id]) S.oxk[o.id]=2; return true; } if(S.my.some(m=>m.w.toLowerCase()===w.toLowerCase())) return false; S.my.push({w,ru,lv}); return true; }
function viewReadList(){
  const st=rdState();
  return `<div class="pg"><div class="pg-h"><div><h1>Чтение</h1><p class="hint">Тексты уровня B2–C1 в формате экзаменов по чтению (STAMP, IELTS, Cambridge): новости, колонки с мнением, научные и деловые статьи. В каждом — словарь, разбор длинного предложения и 5 вопросов: главная мысль, детали, вывод, слово в контексте, позиция автора.</p></div></div>
    <div class="card"><h3>Как читать экзаменационный текст</h3><div class="rtips">${READ_TIPS.map(([t,d])=>`<div><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join("")}</div></div>
    <div class="ggrid">${READ.map(r=>{ const s=st[r.id]; return `<button class="gcard ${s&&s.b>=80?"fin":s?"wip":""}" data-x="rdo:${r.id}"><span class="tag">${esc(r.genre)} · ${LV[r.lvl]}</span><b>${esc(r.title)}</b><span class="en">${esc(r.sit)}</span>
      <span class="gst">${s?`Лучший результат: ${s.b}%`:"Не начат"}</span></button>`; }).join("")}</div></div>`;
}
function viewReadText(){
  const r=rdById[RD.id], st=rdState()[r.id], done=Object.keys(RD.sel).length===r.q.length;
  const ok=r.q.reduce((a,q,i)=>a+(RD.sel[i]===0?1:0),0);
  const newW=r.gl.filter(([w])=>!rdKnown(w)).length;
  return `<div class="pg rd"><div class="pg-h"><div><button class="link" data-x="rdl">← Все тексты</button><span class="tag">${esc(r.genre)} · ${LV[r.lvl]}</span><h1>${esc(r.title)}</h1><p class="hint">${esc(r.sit)}${st?` · лучший результат ${st.b}%`:""}</p></div></div>
    <div class="cols2 rdcols"><article class="card rdtext">${r.text.map(p=>`<div class="rdp">${sayBtn(p,"Послушать абзац")}<p>${esc(p)}</p></div>`).join("")}</article>
    <div class="rdside">
      <div class="card"><h3>Разбор сложного предложения</h3><p class="rdsent">${esc(r.br.s)}</p><ol class="rdbr">${r.br.p.map(([e,ru])=>`<li><b>${esc(e)}</b><span>${esc(ru)}</span></li>`).join("")}</ol></div>
      <div class="card"><div class="plan-h"><h3>Слова и фразы текста</h3>${newW?`<button class="mini t" data-x="rdall">+ Учить все · ${newW}</button>`:""}</div>
        <div class="rdgl">${r.gl.map(([w,ru],i)=>{ const k=rdKnown(w); return `<div>${sayBtn(w)}<div><b>${esc(w)}</b><span>${esc(ru)}</span></div><button class="mini ${k?"":"t"}" data-x="rdw:${i}" ${k?"disabled":""}>${k?"✓":"+"}</button></div>`; }).join("")}</div></div>
    </div></div>
    <div class="card rdq"><h2>Вопросы</h2>${r.q.map((q,i)=>{ const s=RD.sel[i], ans=s!=null;
      return `<div class="rqi"><p><b>${i+1}.</b> ${esc(q[0])}</p><div class="lqopts">${RD.opts[i].map(k=>`<button class="opt ${ans?(k===0?"right":k===s?"wrong":""):""}" data-x="rda:${i}:${k}" ${ans?"disabled":""}><span>${esc(q[1][k])}</span></button>`).join("")}</div>
        ${ans?`<p class="rwhy ${s===0?"ok":"bad"}">${s===0?"Верно.":"Неверно."} ${esc(q[2])}</p>`:""}</div>`; }).join("")}
      ${done?`<div class="rdres"><h3>Результат: ${ok} из ${r.q.length}</h3><p>${ok===r.q.length?"Отлично! Попробуйте следующий текст.":"Перечитайте абзацы, на которые ссылаются объяснения, и выучите слова текста — потом пройдите ещё раз."}</p>
        <div class="row"><button class="b3 ghost" data-x="rdo:${r.id}">Пройти заново</button>${READ[READ.indexOf(r)+1]?`<button class="b3" data-x="rdo:${READ[READ.indexOf(r)+1].id}">Следующий текст</button>`:`<button class="b3" data-x="rdl">Все тексты</button>`}</div></div>`:""}</div></div>`;
}
function viewRead(){ return RD&&rdById[RD.id]?viewReadText():viewReadList(); }
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-x]"); if(!t||t.disabled) return;
  const p=t.dataset.x.split(":"), a=p[0];
  if(a==="rdo") rdOpen(p[1]);
  else if(a==="rdl"){ RD=null; render(); window.scrollTo(0,0); }
  else if(a==="rda"){ if(!RD) return; const i=+p[1], k=+p[2]; if(RD.sel[i]!=null) return; RD.sel[i]=k;
    const r=rdById[RD.id]; if(Object.keys(RD.sel).length===r.q.length){ const pct=Math.round(r.q.reduce((x,q,j)=>x+(RD.sel[j]===0?1:0),0)/r.q.length*100), st=rdState(), c=st[r.id]||{b:0,n:0}; c.b=Math.max(c.b,pct); c.n++; st[r.id]=c; save(); }
    const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==="rdw"){ if(!RD) return; const g=rdById[RD.id].gl[+p[1]]; if(rdAdd(g[0],g[1],rdById[RD.id].lvl)){ save(); const y=window.scrollY; toast("Добавлено в изучение: появится в уроке новых слов."); window.scrollTo(0,y); } }
  else if(a==="rdall"){ if(!RD) return; const r=rdById[RD.id]; let n=0; r.gl.forEach(([w,ru])=>{ if(!rdKnown(w)&&rdAdd(w,ru,r.lvl)) n++; }); save(); const y=window.scrollY; toast(`${n} ${plural(n,"слово","слова","слов")} добавлено в изучение.`); window.scrollTo(0,y); }
});

/* =========================================================
   OXFORD 5000 · passive vs active vocabulary
   A word is "known" (passive) when it is recalled in exercises or marked as known;
   it becomes "active" when the learner has produced it in an own sentence, a spoken phrase or an AI dialogue.
   ========================================================= */
const LV=["A1","A2","B1","B2","C1","C2"];
const OX=(OXRAW+"\n"+C2RAW).split("\n").map((r,i)=>{ const p=r.split("|"); return {id:p[0],w:p[0].replace(/#\d+$/,""),pos:p[1],lv:+p[2],ipa:p[3]?"/"+p[3]+"/":"",ru:p[4],i}; });
OX.forEach(o=>{ const e=typeof OXEX!=="undefined"&&OXEX[o.id]; if(e){ o.ex=e[0]; o.exr=e[1]||""; o.wn=!e[1]; } });
const oxById=Object.fromEntries(OX.map(o=>[o.id,o]));
const OXL=LV.map((_,l)=>OX.filter(o=>o.lv===l));
const myWords=()=>S.my.map(m=>({id:m.w,w:m.w,pos:m.pos||"",lv:m.lv==null?2:Math.min(5,m.lv),ipa:m.ipa||"",ru:m.ru,ex:m.ex||"",my:true}));
const oxRef=o=>(o.my?"m:":"o:")+o.id;
/* 0 new · 1 learning · 2 known · 3 secured */
function oxSt(o){
  const c=S.srs[oxRef(o)], k=S.oxk[o.id];
  if(c) return c.b>=5?3:c.b>=3?2:1;
  if(o.my) return 0;
  if(k===1) return 2; if(k===2) return 0;
  return o.lv<S.oxBase?2:0;
}
const oxUsed=o=>S.use[o.id]||0;
function oxStats(){
  const s=LV.map(()=>({n:0,known:0,learn:0,act:0}));
  OX.forEach(o=>{ const x=s[o.lv]; x.n++; const st=oxSt(o); if(st>=2) x.known++; else if(st===1) x.learn++; if(S.use[o.id]) x.act++; });
  return s;
}
const oxLearnedN=()=>Object.keys(S.srs).filter(r=>r[0]==="o"&&r[1]===":"&&S.srs[r].b>=3).length;
const activeN=()=>OX.reduce((a,o)=>a+(o.lv>=1&&S.use[o.id]?1:0),0);
function oxQueue(n){
  const out=[], fresh=o=>!S.srs[oxRef(o)]&&S.oxk[o.id]!==1;
  myWords().forEach(o=>{ if(out.length<n&&fresh(o)) out.push(o); });
  if(Object.values(S.oxk).includes(2)) for(const o of OX){ if(out.length>=n) break; if(S.oxk[o.id]===2&&fresh(o)) out.push(o); }
  for(let l=Math.min(5,S.oxBase);l<LV.length&&out.length<n;l++) for(const o of OXL[l]){ if(out.length>=n) break; if(fresh(o)&&!out.includes(o)) out.push(o); }
  return out;
}
/* a throwaway "unit" so the existing word exercises work for any list of words */
function oxUnit(list){
  const pool=list.slice(), lv=list[0]?Math.min(5,list[0].lv):2;
  let guard=0; while(pool.length<Math.max(8,list.length+4)&&guard++<300){ const c=rnd(OXL[lv]); if(!pool.some(p=>p.w===c.w)) pool.push(c); }
  return {id:"o",ox:true,n:0,lvl:LV[lv],ru:lv>=5?"C2":"Oxford 5000",c:"#2847D0",ud:"#1A2F94",objs:pool,refs:pool.map(oxRef),pos:pool.map(o=>o.pos),
    words:pool.map(o=>[o.w,o.ipa,o.ru,(S.oxx[o.id]||{}).ex||o.ex||""]),build:[]};
}
function exOxi(u,i){ return {type:"oxi",u,i,w:u.words[i],o:u.objs[i],ref:u.refs[i],nocheck:true}; }
function oxLesson(){
  const t=oxQueue(5); if(!t.length) return [];
  const u=oxUnit(t), ids=t.map((_,i)=>i), items=[], a=ids.slice(0,3), b=ids.slice(3);
  const drill=i=>rnd([exMcq,exListen])(u,i);
  a.forEach(i=>items.push(exOxi(u,i))); a.forEach(i=>items.push(drill(i)));
  b.forEach(i=>items.push(exOxi(u,i))); b.forEach(i=>items.push(drill(i)));
  if(ids.length>=3) items.push(exMatch(u,shuffle(ids)));
  shuffle(ids).forEach((i,k)=>items.push(k%2?exType(u,i):exRu(u,i)));
  items.push(exOwn(u,rnd(ids)));
  return items;
}
/* words the learner recognises but has never produced, most frequent first */
function actPool(n){
  const out=[];
  for(let l=Math.min(5,S.oxBase);l<LV.length;l++) for(const o of OXL[l]) if(oxSt(o)>=2&&!oxUsed(o)) out.push(o);
  out.sort((x,y)=>(S.srs["o:"+y.id]?1:0)-(S.srs["o:"+x.id]?1:0)||x.lv-y.lv||x.i-y.i);
  if(out.length<n) for(const o of OXL[Math.max(1,S.oxBase-1)]){ if(out.length>=n) break; if(!oxUsed(o)&&/^(n|v|adj|adv)/.test(o.pos)) out.push(o); }
  return out.slice(0,n);
}
function actLesson(){ const t=actPool(5); if(!t.length) return []; const u=oxUnit(t); return t.map((_,i)=>exOwn(u,i)); }

/* AI adds an example and a mnemonic to the new words of the running lesson */
const OXE={busy:false};

  const objs=L.items.filter(e=>e.type==="oxi").map(e=>e.o).filter(o=>!S.oxx[o.id]); if(!objs.length) return;
  OXE.busy=true; if(S.view==="lesson"&&cur()&&cur().type==="oxi") render();
  try{
    const j=await AI.json(`For each English word below, help a Russian-speaking learner (level ${LV[objs[0].lv]}, works in international real estate) remember it. Give: one natural example sentence of at most 14 words using the word in the given meaning (business or everyday context), its Russian translation, and a short vivid mnemonic in Russian (a sound-alike with a Russian word or a memorable image, one sentence).
Words:

function oxForms(){
  if(OXF) return OXF; OXF=new Map(); const add=(f,id)=>{ if(!OXF.has(f)) OXF.set(f,id); };
  OX.forEach(o=>{ const w=o.w.toLowerCase(); if(!/[^a-z'-]/.test(w)) add(w,o.id); });
  OX.forEach(o=>{ const w=o.w.toLowerCase(); if(/[^a-z]/.test(w)||w.length<3||!/n|v|adj/.test(o.pos)) return;
    const e=w.endsWith("e"), y=/[^aeiou]y$/.test(w), dbl=/[^aeiou][aeiou][bdgmnprt]$/.test(w)&&w.length<=6;
    add(w+"s",o.id); if(/(s|x|z|ch|sh|o)$/.test(w)) add(w+"es",o.id);
    if(y){ add(w.slice(0,-1)+"ies",o.id); add(w.slice(0,-1)+"ied",o.id); }
    if(/v/.test(o.pos)){ add(e?w+"d":w+"ed",o.id); add(e?w.slice(0,-1)+"ing":w+"ing",o.id); if(dbl){ add(w+w.slice(-1)+"ed",o.id); add(w+w.slice(-1)+"ing",o.id); } }
    if(/adj/.test(o.pos)&&w.length<=6){ add(e?w+"r":y?w.slice(0,-1)+"ier":w+"er",o.id); add(e?w+"st":y?w.slice(0,-1)+"iest":w+"est",o.id); }
  });
  IRR.split(";").forEach(p=>{ const [b,fs]=p.split(":"); if(oxById[b]) fs.split(",").forEach(f=>add(f,b)); });

}
function oxScan(text){
  const F=oxForms(), seen=new Set();

}

function useText(text){
  let nw=0;
  oxScan(text).forEach(id=>{ if(!S.use[id]&&oxById[id].lv>=1) nw++; S.use[id]=Math.min(99,(S.use[id]||0)+1); });
  const low=" "+String(text||"").toLowerCase()+" ";
  OXL[5].forEach(o=>{ if(o.w.includes(" ")&&low.includes(o.w.toLowerCase())){ if(!S.use[o.id]) nw++; S.use[o.id]=Math.min(99,(S.use[o.id]||0)+1); } });
  S.my.forEach(m=>{ if(low.includes(m.w.toLowerCase())){ if(!S.use[m.w]) nw++; S.use[m.w]=Math.min(99,(S.use[m.w]||0)+1); } });

}

function oxChips(text){
  const c=oxScan(text).map(id=>oxById[id]).filter(o=>o.lv>=Math.max(1,S.oxBase)&&oxSt(o)===0).sort((a,b)=>b.lv-a.lv).slice(0,3);

    <div class="lvgrid">${LV.map((n,l)=>`<button class="lvc ${oxLv===l?"on":""}" data-x="oxlv:${l}"><span class="oxl lv${l}">${n}</span><b>${st[l].known}<small>/${st[l].n}</small></b><span>${st[l].act} в активе</span><div class="lbar"><i style="width:${(st[l].known/st[l].n*100).toFixed(1)}%"></i><b style="width:${(st[l].act/st[l].n*100).toFixed(1)}%"></b></div></button>`).join("")}</div>
    <div class="filters"><div class="seg"><button data-x="oxtab:ox" aria-pressed="${oxTab==="ox"}">Oxford 5000</button><button data-x="oxtab:my" aria-pressed="${oxTab==="my"}">Мой словарь · ${S.my.length}</button></div><button class="link" data-view="dict">Словарь недвижимости · ${TOTALW} →</button></div>
    ${oxTab==="ox"?`<div class="filters"><input id="oxq" class="search" type="search" placeholder="Поиск: negotiate, устойчивый, yield…" value="${esc(oxQ)}" aria-label="Поиск по Oxford 5000"></div>
    <div class="filters"><button class="fchip" data-x="oxlv:-1" aria-pressed="${oxLv===-1}">Все уровни</button>${F.map(([k,l])=>`<button class="fchip" data-x="oxf:${k}" aria-pressed="${oxF===k}">${l}</button>`).join("")}</div>`:""}
    <div class="oxlist" id="oxlist"></div></div>`;
}
function oxRow(o){
  const st=oxSt(o), u=oxUsed(o), c=S.srs[oxRef(o)], t=dayNum();
  const mem=["Новое","Учу","Знаю","Закреплено"][st]+(c&&c.b>0?(c.due<=t?" · повторить сегодня":" · через "+(c.due-t)+" дн."):S.oxk[o.id]===2?" · в очереди":"");
  const btn=o.my?`<button class="mini" data-x="mydel:${esc(o.id)}" aria-label="Удалить ${esc(o.w)}">${ico("x")}</button>`
    :c?"":st>=2?`<button class="mini t" data-x="oxk:${esc(o.id)}:2">Учить</button>`:`${S.oxk[o.id]===2?"":`<button class="mini t" data-x="oxk:${esc(o.id)}:2">В очередь</button>`}<button class="mini t" data-x="oxk:${esc(o.id)}:1">Знаю</button>`;
  return `<div class="ow"><span class="oxl lv${o.lv}">${LV[o.lv]}</span><div class="owm"><b>${esc(o.w)}</b><span class="ipa">${esc(o.ipa)}${o.pos?" · "+esc(o.pos):""}</span><span>${esc(o.ru)}</span>${o.ex?`<span class="owx">${hl(o.ex,o.w)}</span>`:""}
    <span class="ost"><i class="s${st}"></i>${mem}${u?`<em class="act">в активе · ${u}×</em>`:st>=2?`<em>ещё не использовали</em>`:""}</span></div><div class="owb">${sayBtn(o.w)}${btn}</div></div>`;
}
function drawOx(){
  const el=document.getElementById("oxlist"); if(!el) return;
  if(oxTab==="my"){ const m=myWords(); el.innerHTML=m.length?m.map(oxRow).join(""):`<p class="hint">Здесь будут ваши слова: из переписки, уроков, статей. Нажмите «Добавить свои», вставьте слова или целый абзац, и приложение найдёт значения.</p>`; return; }
  const q=oxQ.trim().toLowerCase();
  const rows=OX.filter(o=>(oxLv<0||o.lv===oxLv)&&(!q||o.w.toLowerCase().includes(q)||o.ru.toLowerCase().includes(q))).filter(o=>{
    if(oxF==="all") return true; const st=oxSt(o), u=oxUsed(o);
    return oxF==="new"?st===0:oxF==="learn"?st===1:oxF==="known"?st>=2:oxF==="act"?u>0:st>=2&&!u; });
  el.innerHTML=rows.length?`<p class="hint">Найдено: ${rows.length}</p>`+rows.slice(0,oxShow).map(oxRow).join("")+(rows.length>oxShow?`<button class="b3 ghost wide" data-x="oxmore">Показать ещё ${Math.min(60,rows.length-oxShow)}</button>`:"")
    :`<p class="hint">Ничего не нашлось. Попробуйте другое слово или снимите фильтры.</p>`;
}
/* quick sort: know / don't know, to clear the list of what is already familiar */
let TRI=null;
function triStart(l){ const q=OXL[l].filter(o=>!S.srs["o:"+o.id]&&!S.oxk[o.id]).slice(0,40); TRI={l,q,i:0,shown:false,k:0,u:0}; S.view="triage"; modal=null; render(); window.scrollTo(0,0); if(q[0]&&S.voice) say(q[0].w); }
function triAns(know){ if(!TRI||TRI.i>=TRI.q.length) return; const o=TRI.q[TRI.i]; S.oxk[o.id]=know?1:2; know?TRI.k++:TRI.u++; TRI.i++; TRI.shown=false; render(); const n=TRI.q[TRI.i]; if(n&&S.voice) say(n.w); }
function viewTriage(){
  if(!TRI) TRI={l:Math.min(5,S.oxBase),q:[],i:0,shown:false,k:0,u:0,idle:true};
  const lvls=`<div class="filters">${LV.map((n,l)=>`<button class="fchip" data-x="tri:${l}" aria-pressed="${TRI.l===l&&!TRI.idle}">${n}</button>`).join("")}</div>`;
  const o=TRI.q[TRI.i], head=`<div class="pg-h"><div><h1>Быстрая сортировка</h1><p class="hint">Отметьте знакомые слова, чтобы не тратить на них время. «Не знаю» отправляет слово в очередь на изучение. Клавиши: ← не знаю, → знаю, пробел — перевод.</p></div><button class="link" data-view="words">← К словам</button></div>${lvls}`;
  if(!o) return `<div class="pg">${head}<div class="card tricard">${TRI.idle?`<h2>Выберите уровень</h2><p>За один заход — до 40 слов.</p>`:`<h2>${TRI.q.length?"Готово":"На этом уровне всё разобрано"}</h2><p>Знаю: <b>${TRI.k}</b> · в очередь на изучение: <b>${TRI.u}</b></p>
      <div class="row"><button class="b3 ghost" data-x="tri:${TRI.l}">Ещё 40 слов</button><button class="b3" data-start="ox:ox">Учить слова из очереди</button></div>`}</div></div>`;
  return `<div class="pg">${head}<div class="pbar"><i style="width:${Math.max(3,TRI.i/TRI.q.length*100)}%"></i></div>
    <div class="card tricard"><span class="oxl lv${o.lv}">${LV[o.lv]}</span><div class="prompt"><span class="big">${esc(o.w)}</span>${sayBtn(o.w)}</div><span class="ipa">${esc(o.ipa)}${o.pos?" · "+esc(o.pos):""}</span>
      ${TRI.shown?`<div class="ru">${esc(o.ru)}</div>`:`<button class="link" data-x="trishow">Показать перевод</button>`}
      <div class="row"><button class="b3 bad" data-x="trians:0">Не знаю</button><button class="b3 ok" data-x="trians:1">Знаю</button></div>
      <p class="hint">${TRI.i+1} из ${TRI.q.length}</p></div></div>`;
}
function viewGram(){
  const gs=gramStats(), ng=nextGram();
  const card=g=>{ const c=S.gr[g.id], b=c?c.b:0; return `<button class="gcard ${b>=80?"fin":c?"wip":""}" data-x="gt:${g.id}"><span class="tag">${esc(GCATS[g.cat])}</span><b>${esc(g.t)}</b><span class="en">${esc(g.en)}</span>
    <span class="gst">${b>=80?ico("star")+" Освоена · "+b+"%":c?"В работе · "+b+"%":"Не начата"}</span></button>`; };
  return `<div class="pg"><div class="pg-h"><div><h1>Грамматика</h1><p class="hint">${GRAMMAR.length} тем от A2 до C2. В каждой: правило простыми словами, схема построения предложения, типичные ошибки русскоязычных и 10 упражнений. Тема освоена от 80%.</p></div>
      <button class="b3" data-x="gt:${ng.id}">${ico("pen")}Следующая: ${esc(ng.t)}</button></div>
    ${PATHL.map((l,i)=>`<div class="lvlband"><span class="tag">Уровень ${l} · ${gs[l].done}/${gs[l].n}</span><p>${["Фундамент: to be, базовые времена, сравнения, количество, can/could, предлоги.","Основа: порядок слов, вопросы, времена, условные, пассив.","Точность: сожаления, предположения, косвенная речь, связки, обороты.","Стиль: инверсия, расщепление, сослагательное, осторожные формулировки, деловой регистр.","Мастерство: оттенки модальности, уступка, тонкости артиклей, сложные модели глаголов, смена регистра, тактичность."][i]}</p></div>
      <div class="ggrid">${GRAMMAR.filter(g=>g.lvl===l).map(card).join("")}</div>`).join("")}</div>`;
}
function xPracticeCards(){
  const ap=actPool(5);
  return `<div class="cols2"><div class="card"><h3><span style="color:var(--accent)">${ico("spark")}</span>ИИ-тренер: живой диалог</h3><p>Сценарии от A2 до C1. После каждой реплики: исправление, правило и вариант «уровнем выше». Незнакомые слова собеседника можно одним касанием отправить в свой словарь.</p><button class="b3 wide" data-view="ai">Выбрать сценарий</button></div>
    <div class="card"><h3><span style="color:var(--accent)">${ico("pen")}</span>Слова в актив</h3><p>${ap.length?"Вы узнаёте эти слова, но ещё не использовали: "+esc(ap.map(o=>o.w).join(", "))+". Составьте с каждым своё предложение.":"Выучите несколько слов из Oxford 5000, и здесь появится тренировка."}</p><button class="b3 ghost wide" data-start="ox:act" ${ap.length?"":"disabled"}>Составить 5 предложений</button></div></div>`;
}
function xSettings(){
  return `<div class="setrow"><span>Мой уровень сейчас<small class="hint"> · слова ниже него считаются знакомыми</small></span><div class="seg">${[[1,"A2"],[2,"B1"],[3,"B2"],[4,"C1"]].map(([v,l])=>`<button data-x="base:${v}" aria-pressed="${S.oxBase===v}">${l}</button>`).join("")}</div></div>
    <div class="setrow"><span>Новых слов в день</span><div class="seg">${[5,10,20].map(g=>`<button data-x="oxgoal:${g}" aria-pressed="${S.oxGoal===g}">${g}</button>`).join("")}</div></div>
    <div class="setrow"><span>ИИ-примеры и ассоциации к новым словам</span><div class="seg"><button data-x="oxai:1" aria-pressed="${S.oxAI!==false}">Вкл</button><button data-x="oxai:0" aria-pressed="${S.oxAI===false}">Выкл</button></div></div>`;
}

/* ---- sheets: grammar topic, first-run setup, add own words ---- */
const ADDW={text:"",busy:false,msg:""};
const XM={
  gtopic:()=>{ const g=gById[modal.id], c=S.gr[g.id];
    return `<div class="veil" data-act="close"><div class="sheet wide" role="dialog" aria-modal="true" aria-label="${esc(g.t)}">
      <div class="sheet-top"><div><span class="tag">Грамматика · ${g.lvl} · ${esc(GCATS[g.cat])}</span><h2>${esc(g.t)}</h2><span class="en">${esc(g.en)}</span></div></div>
      ${gTopicHTML(g)}
      ${c?`<p class="hint">Лучший результат: ${c.b}% · попыток: ${c.n}</p>`:""}
      <div class="row"><button class="b3 ghost" data-act="close">Закрыть</button><button class="b3" data-start="${g.id}:g">Начать тренировку · ${g.q.length} заданий</button></div></div></div>`; },
  onb:()=>`<div class="veil"><div class="sheet" role="dialog" aria-modal="true" aria-label="Настройка курса">
      <div class="sheet-top"><div class="pic" style="width:72px">${mascot("happy")}</div><div><span class="tag">Новая версия</span><h2>Курс A2 → C2</h2></div></div>
      <p>В приложении словарь Oxford 5000 и подборка C2, грамматика от A2 до C2, «Живой английский» со сленгом и мемами и учёт активного словаря: слова, которые вы узнаёте, и слова, которые сами используете, считаются отдельно.</p>
      <h3>Какой у вас уровень сейчас?</h3>
      <div class="seg wide">${[[1,"A2","базовый"],[2,"B1","средний"],[3,"B2","выше среднего"],[4,"C1","продвинутый"]].map(([v,l,d])=>`<button data-x="base:${v}" aria-pressed="${S.oxBase===v}"><b>${l}</b><small>${d}</small></button>`).join("")}</div>
      <p class="hint">Слова ниже этого уровня будут считаться знакомыми. Это можно поменять в профиле или уточнить «Быстрой сортировкой».</p>
      <h3>Сколько новых слов в день?</h3>
      <div class="seg wide">${[[5,"спокойно"],[10,"уверенно"],[20,"интенсивно"]].map(([g,d])=>`<button data-x="oxgoal:${g}" aria-pressed="${S.oxGoal===g}"><b>${g}</b><small>${d}</small></button>`).join("")}</div>
      <button class="b3 wide" data-x="onbdone">Начать</button></div></div>`,
  addw:()=>`<div class="veil" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="Добавить слова">
      <div class="sheet-top"><div><span class="tag">Мой словарь</span><h2>Добавить слова</h2></div></div>
      <p>Вставьте слова через запятую или с новой строки. Можно сразу с переводом: <b>escrow — счёт эскроу</b>. ${AI?"Можно вставить и целый абзац: ИИ выберет из него полезные слова уровня B2–C1 и найдёт значения.":"Без подключённого ИИ укажите перевод через тире."}</p>
      <label class="tag" for="addwin">Слова или текст</label>
      <textarea id="addwin" class="typein" placeholder="due diligence, to leverage, off-plan — на стадии строительства" ${ADDW.busy?"disabled":""}>${esc(ADDW.text)}</textarea>
      ${ADDW.msg?`<p class="okline">${esc(ADDW.msg)}</p>`:""}
      <div class="row"><button class="b3 ghost" data-act="close">Закрыть</button><button class="b3" data-x="addgo" ${ADDW.busy?"disabled":""}>${ADDW.busy?"Ищу значения…":"Добавить"}</button></div></div></div>`
};
async function addWords(){
  const raw=ADDW.text.trim(); if(!raw||ADDW.busy) return;
  const isText=!/[\n,;]/.test(raw)&&raw.split(/\s+/).length>8;
  let q=0, added=0; const need=[];
  const has=w=>S.my.some(m=>m.w.toLowerCase()===w.toLowerCase());
  if(!isText) raw.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean).slice(0,30).forEach(tok=>{
    const m=tok.split(/\s+[-—–=:]\s+/), w=m[0].trim().replace(/^to\s+(?=\S+\s)/i,"to "), ru=(m[1]||"").trim();
    if(!w||w.length>60||has(w)) return;
    const o=oxById[w.toLowerCase()];
    if(o&&!ru){ if(!S.srs["o:"+o.id]) S.oxk[o.id]=2; q++; }
    else if(ru){ S.my.push({w,ru}); added++; }
    else need.push(w);
  });
  if((need.length||isText)&&AI){
    ADDW.busy=true; ADDW.msg=""; render();
    try{
      const j=await AI.json(isText
        ?`From the English text below pick up to 12 words or collocations that are most useful for a Russian-speaking learner moving from B1 to C1 (skip A1-B1 basics and proper names). For each give the dictionary form, IPA, CEFR level, a Russian translation that fits this text, and one short example sentence.\nText: """${raw.slice(0,3000)}"""\nReply with only JSON: {"items":[{"w":"word or collocation","ipa":"/.../","lvl":"B2","ru":"перевод","ex":"example sentence"}]}`
        :`Give dictionary data for these English words or phrases for a Russian-speaking learner who works in real estate: ${need.map(w=>`"${w}"`).join(", ")}.\nReply with only JSON: {"items":[{"w":"the word exactly as given","ipa":"/.../","lvl":"CEFR level A1-C1","ru":"перевод на русский, 1-3 значения","ex":"one short example sentence"}]}`,{modelTier:"quick"});
      (j.items||[]).slice(0,30).forEach(it=>{ const w=String(it.w||"").trim(); if(!w||!it.ru||has(w)||w.length>60) return;
        const o=oxById[w.toLowerCase()]; if(o){ if(oxSt(o)===0){ S.oxk[o.id]=2; q++; } return; }
        S.my.push({w,ru:String(it.ru).slice(0,160),ipa:String(it.ipa||"").slice(0,60),ex:String(it.ex||"").slice(0,200),lv:Math.max(0,LV.indexOf(String(it.lvl||"").toUpperCase()))||2}); added++; });
    }catch(e){ aiDrop(e); ADDW.msg=aiErrText(e); }
    ADDW.busy=false;
  } else if(need.length) ADDW.msg=`Для этих слов укажите перевод через тире: ${need.join(", ")}.`;
  if(added||q){ ADDW.text=need.length&&!AI?need.join(", "):""; ADDW.msg=(ADDW.msg?ADDW.msg+" ":"")+`Готово: ${added?added+" в «Мой словарь»":""}${added&&q?", ":""}${q?q+" из Oxford 5000 в очередь на изучение":""}.`; oxTab=added?"my":oxTab; }
  else if(!ADDW.msg) ADDW.msg="Новых слов не нашлось: возможно, они уже есть в словаре.";
  save(); render();
}

/* ---- events for everything above ---- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-x]"); if(!t||t.disabled) return;
  const p=t.dataset.x.split(":"), a=p[0], b=p[1];
  if(a==="gt"){ modal={t:"gtopic",id:b}; render(); }
  else if(a==="base"){ S.oxBase=+b; render(); }
  else if(a==="oxgoal"){ S.oxGoal=+b; render(); }
  else if(a==="oxai"){ S.oxAI=b==="1"; render(); }
  else if(a==="onbdone"){ S.onb=1; modal=null; S.view="home"; render(); window.scrollTo(0,0); }
  else if(a==="oxlv"){ oxLv=oxLv===+b?-1:+b; oxShow=60; oxTab="ox"; render(); }
  else if(a==="oxf"){ oxF=b; oxShow=60; render(); }
  else if(a==="oxtab"){ oxTab=b; render(); }
  else if(a==="oxmore"){ oxShow+=60; drawOx(); }
  else if(a==="oxk"){ S.oxk[b]=+p[2]; const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==="oxq"){ S.oxk[b]=2; toast("Слово добавлено в очередь на изучение."); }
  else if(a==="mydel"){ S.my=S.my.filter(m=>m.w!==b); delete S.srs["m:"+b]; S.mist=S.mist.filter(r=>r!=="m:"+b); render(); }
  else if(a==="tri") triStart(+b);
  else if(a==="trishow"){ if(TRI){ TRI.shown=true; render(); } }
  else if(a==="trians") triAns(b==="1");
  else if(a==="addw"){ ADDW.msg=""; modal={t:"addw"}; render(); }
  else if(a==="addgo") addWords();
  else if(a==="enrich") oxEnrich(true);
});
document.addEventListener("input",e=>{
  if(e.target.id==="oxq"){ oxQ=e.target.value; oxShow=60; drawOx(); }
  if(e.target.id==="addwin") ADDW.text=e.target.value;
});
document.addEventListener("keydown",e=>{
  if(S.view!=="triage"||!TRI||modal||/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==="ArrowRight") triAns(true); else if(e.key==="ArrowLeft") triAns(false); else if(e.key===" "){ e.preventDefault(); TRI.shown=true; render(); }
});

/* boot */
const hv=(location.hash||"").slice(1); if(["dict","profile","ai","words","gram","path","live","read","learn"].includes(hv)) S.view=hv;
if(S.view==="triage") S.view="words";
render();

</script>

</body></html>
